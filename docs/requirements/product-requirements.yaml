# AustroFit Produkt-Anforderungen (Product Requirements)
# Formale Anforderungen mit REQ-P-IDs für Entwicklungssteuerung und Fördernachweis.
# Ablage: docs/requirements/product-requirements.yaml
# Erstellt: 2026-05-21
#
# Cross-References:
#   feature_ref       → docs/features.yaml (slug)
#   compliance_ref    → docs/compliance.yaml (requirement id)
#   req_ref           → docs/requirements/*.yaml (anderes Dok.)

meta:
  titel: AustroFit Produkt-Anforderungen
  version: "1.0"
  erstellt: "2026-05-21"
  mvp_ziel: "Code-Freeze v1.0, Q3 2026"
  beschreibung: >
    Produkt-Anforderungen nach Requirements-Driven Development.
    Jede Anforderung trägt eine stabile REQ-P-ID, die in Code-Commits,
    PR-Beschreibungen und Förderanträgen referenziert wird.
    Implementierungs-Details (Formeln, API-Gotchas, Sicherheitsregeln)
    bleiben in docs/features.yaml und CLAUDE.md.
  status_werte:
    implemented: "Im Code vorhanden und produktiv aktiv"
    in-progress: "In Entwicklung oder teilweise implementiert"
    open:         "Noch nicht implementiert (MVP-Pflicht)"
    deferred:     "Bewusst auf spätere Phase verschoben"
    rejected:     "Bewusst verworfen – Begründung in notes"
  prioritaet_werte:
    P1-MVP:  "Pflicht für Go-Live v1.0 (Q3 2026)"
    P2:      "Phase 2 – nach erstem Launch (Jahr 1–3)"
    P3:      "Phase 3+ – langfristig (Jahr 3+)"

requirements:

  # ═══════════════════════════════════════════════════════════════════
  # GAMIFICATION
  # ═══════════════════════════════════════════════════════════════════

  - id: REQ-P-001
    titel: Punkte-Buchungssystem (append-only Ledger)
    feature_ref: punkte-ledger
    prioritaet: P1-MVP
    status: implemented
    kategorie: gamification
    beschreibung: >
      Das System muss jede Punkte-Transaktion unveränderbar erfassen.
      Der aktuelle Kontostand ergibt sich immer als Summe aller Buchungen.
      Korrekturbuchungen sind als negative Deltas möglich (nie Löschung).
    akzeptanzkriterien:
      - Jede Buchung enthält: user_id, points_delta, source_type, source_ref, occurred_at, rule_version
      - Kontostand = SUM(points_delta) stimmt nach jeder Transaktion
      - Bereits geschriebene Einträge werden nie überschrieben (append-only)
      - Einlösungen (negatives Delta) reduzieren den Kontostand, aber nicht das Level
      - API /api/ledger-total liefert Netto-Kontostand und earned-Only-Kontostand (positive_only=true)
    foerdernachweis: >
      Implementiert März–Mai 2026. Directus Collection 'points_ledger'.
      Code: src/lib/server/stepsService.ts, cardioService.ts, streak.ts,
      src/routes/api/ledger-total/+server.ts, src/routes/api/ledger-entries/+server.ts.
      Produktiv: https://dev.austrofit.at

  - id: REQ-P-002
    titel: Level-System (20 Stufen, österreichisches Branding)
    feature_ref: level-system
    prioritaet: P1-MVP
    status: implemented
    kategorie: gamification
    beschreibung: >
      Nutzer steigen in 20 Leveln auf, basierend auf verdienten Punkten (nur positive
      Buchungen, sog. earnedPoints). Einlösungen dürfen das Level nie senken.
      Die Level tragen AustroFit-Branding alle 5 Stufen (z. B. „AustroFit Aktiv" = Level 5).
    akzeptanzkriterien:
      - Level basiert ausschließlich auf earnedPoints (positive_only=true), nie auf Netto-Kontostand
      - 20 Level von „Einsteiger" (0P) bis „AustroFit Olympier" (480.000P)
      - Level-Name und Fortschrittsbalken werden im Dashboard korrekt angezeigt
      - Einlösung von Punkten verändert das Level nicht
      - AustroFit-Branding-Level (5, 10, 15, 20) sind visuell hervorgehoben
    foerdernachweis: >
      Implementiert März 2026. Code: src/lib/utils/level.ts.
      Dashboard-Integration: src/routes/dashboard/+page.svelte.

  - id: REQ-P-003
    titel: Schritt-Streak (täglich, 4 Tiers)
    feature_ref: streak-schritte
    prioritaet: P1-MVP
    status: implemented
    kategorie: gamification
    beschreibung: >
      Nutzer erhalten einen zusätzlichen Bonus für aufeinanderfolgende Tage mit ≥7.000 Schritten.
      Der Bonus steigt in 4 Tiers (nach 2, 14, 28 und 56 Tagen).
    akzeptanzkriterien:
      - Tages-Streak-Bonus wird nur bei ≥7.000 Schritten ausgelöst
      - 4 Tiers: +20P (2–13d), +30P (14–27d), +45P (28–55d), +60P (56+d)
      - Streak-Zähler wird bei einem ausgelassenen Tag auf 0 zurückgesetzt
      - Buchung erscheint im Ledger mit source_type='streak_tag'
      - Streak-Tage-Zähler ist in user_profiles.streak_days persistent
    foerdernachweis: >
      Implementiert März–April 2026. Code: src/lib/server/streak.ts.
      Streak-Speicherung: Directus Collection 'user_profiles' (streak_days, longest_streak).

  - id: REQ-P-004
    titel: Streak-Wochen-Bonus Schritte (wöchentlich, 4 Tiers)
    feature_ref: streak-wochen-bonus
    prioritaet: P1-MVP
    status: implemented
    kategorie: gamification
    beschreibung: >
      Jede vollständige Woche (7 Tage) im Streak löst zusätzlich einen Wochen-Bonus aus.
      Der Bonus steigt ebenfalls in 4 Tiers.
    akzeptanzkriterien:
      - Wochen-Bonus feuert wenn (streak_days - 1) % 7 === 0
      - 4 Tiers: +60P / +90P / +120P / +150P
      - Dedup-Check verhindert Doppelbuchung bei parallelen Requests
      - Buchung erscheint im Ledger mit source_type='streak'
    foerdernachweis: >
      Implementiert April 2026, Dedup-Fix Mai 2026.
      Code: src/lib/server/streak.ts.

  - id: REQ-P-005
    titel: Cardio-Streak (wöchentlich, 4 Tiers)
    feature_ref: streak-cardio
    prioritaet: P1-MVP
    status: implemented
    kategorie: gamification
    beschreibung: >
      Nutzer erhalten einen Bonus für aufeinanderfolgende Wochen, in denen sie ihr
      Cardio-Wochenziel vollständig erreichen. Ziel ist gruppenspezifisch (WHO-Empfehlungen).
    akzeptanzkriterien:
      - Bonus startet ab der zweiten aufeinanderfolgenden Vollwoche
      - 4 Tiers: W2–3 +100P / W4–7 +200P / W8–11 +300P / W12+ +400P
      - Bonus ist gruppenspezifisch (adult/senior/pregnant: 150 Min., chronic: 100 Min.)
      - Buchung: source_type='streak', source_ref='cardio-streak-{weekKey}'
    foerdernachweis: >
      Implementiert April 2026. Code: src/lib/server/cardioService.ts, streak.ts.

  - id: REQ-P-006
    titel: Quiz-Streak (täglich + wöchentlich, 4 Tiers)
    feature_ref: streak-quiz
    prioritaet: P1-MVP
    status: implemented
    kategorie: gamification
    beschreibung: >
      Nutzer erhalten Bonus-Punkte für aufeinanderfolgende Tage mit abgeschlossenen Quizzen,
      sowie wöchentliche Meilensteinboni.
    akzeptanzkriterien:
      - Tages-Bonus ab Tag 2: T1(2–6d)+5P / T2(7–13d)+10P / T3(14–29d)+15P / T4(30+d)+20P
      - Wochen-Bonus bei 7 aufeinanderfolgenden Quiz-Tagen: T1+30P / T2+50P / T3+75P / T4+100P
      - Buchung Tages-Bonus: source_type='streak_quiz'
      - Buchung Wochen-Bonus: source_type='streak'
      - Quiz-Streak-Tage in user_profiles.quiz_streak_days persistent
    foerdernachweis: >
      Implementiert April 2026. Code: src/lib/server/streak.ts,
      src/routes/api/claim/+server.ts.

  - id: REQ-P-007
    titel: Milestones (22 einmalige Erstleistungs-Boni)
    feature_ref: milestones
    prioritaet: P1-MVP
    status: implemented
    kategorie: gamification
    beschreibung: >
      Nutzer erhalten einmalige Bonus-Punkte beim ersten Erreichen wichtiger Meilensteine
      (erste Schritte, erste Woche Streak, erster Quiz, etc.).
    akzeptanzkriterien:
      - 22 Milestones über 3 Kategorien: Schritte (7), Cardio (4), Quiz (7), Sonstiges (4)
      - Jeder Milestone wird nur einmal vergütet (Dedup via source_ref='milestone-{slug}')
      - Vergabe erfolgt server-seitig nach dem jeweiligen Aktivitäts-Event
      - Milestone-Buchungen sind im Ledger mit source_type='milestone' sichtbar
    foerdernachweis: >
      Implementiert April 2026. Code: src/lib/utils/milestones.ts,
      src/lib/server/milestoneService.ts.

  - id: REQ-P-008
    titel: Badges (113 Österreich-Badges nach Schritten)
    feature_ref: badges
    prioritaet: P1-MVP
    status: implemented
    kategorie: gamification
    beschreibung: >
      113 Badges repräsentieren österreichische Orte und Regionen. Earned-Status basiert
      auf der Gesamtschritt-Summe des Nutzers (total_steps >= step_threshold).
    akzeptanzkriterien:
      - 113 Badges in Directus Collection 'Badges', alle status='published'
      - Earned-Flag berechnet sich client-seitig: total_steps >= step_threshold
      - Badges sind nach Typen gruppiert: hauptstadt, bundesland, oesterreich, wanderweg, see, berg
      - Dashboard zeigt earned Badges in Vorschau; /profil/auszeichnungen zeigt alle
      - Badge-Bilder: Emoji-Platzhalter bis Upload (Phase 2)
    foerdernachweis: >
      Implementiert März 2026 (Schema + Daten), UI April 2026.
      Code: src/routes/api/badges/+server.ts, src/lib/utils/badges.ts.
    notes: Badge-Bilder-Upload ist Phase-2-Arbeit.

  - id: REQ-P-009
    titel: Challenges (zeitlich begrenzte Aufgaben)
    feature_ref: challenges
    prioritaet: P1-MVP
    status: in-progress
    kategorie: gamification
    beschreibung: >
      Nutzer können zeitlich begrenzte Challenges mit klar definierten Zielen (Schritte,
      Quiz-Streak, Cardio-Woche) absolvieren und dafür einmalig Punkte erhalten.
    akzeptanzkriterien:
      - Challenges werden im Dashboard angezeigt (aktiv_bis in der Zukunft, status='published')
      - Completion-Typen: steps_total, steps_today, quiz_streak, cardio_week, manual
      - Nutzer kann Challenge nur einmal claimen (Dedup: source_type='challenge', source_ref='challenge-{id}')
      - Abgelaufene Challenges erscheinen nicht mehr im aktiven Dashboard
      - Punkte-Vergabe via points_ledger
    foerdernachweis: >
      Schema in Directus Mai 2026 (Felder: aktiv_von, completion_type, target_value).
      API /api/challenges implementiert. Completion-Logik: ausstehend.
    notes: Completion-Logik und Claim-Button als offene MVP-Punkte.

  - id: REQ-P-010
    titel: Gewinnspiele / Lotteries
    feature_ref: gewinnspiele
    prioritaet: P2
    status: deferred
    kategorie: gamification
    beschreibung: >
      Regelmäßige Gewinnspiele für aktive Nutzer als Engagement-Element (Octalysis Core Drive 4).
      Gestaltung als kostenloses Preisausschreiben (kein Einsatz = kein Glücksspiel lt. GSpG).
    akzeptanzkriterien:
      - Teilnahme ohne Kaufverpflichtung möglich
      - Gewinnspiel-Mechanik ist rechtlich als Preisausschreiben gestaltet
      - 5% Glücksspielsteuer auf Gewinne >10.000€ beachtet
    compliance_ref: gspg-gewinnspiele-design

  - id: REQ-P-045
    titel: Individuelle Zielsetzung (Custom Step/Cardio Goals)
    prioritaet: P2
    status: deferred
    kategorie: gamification
    beschreibung: >
      Nutzer können eigene Schritt- oder Cardio-Tagesziele über dem Systemminimum setzen.
      Das Dashboard zeigt den Fortschritt zum persönlichen Ziel; Punkte werden weiterhin
      ab dem Systemminimum vergütet.
    akzeptanzkriterien:
      - Nutzer kann eigenes Tagesziel für Schritte setzen (z.B. 10.000 statt 7.000)
      - Persönliches Ziel in Profil-Einstellungen konfigurierbar
      - Dashboard-Fortschrittsbalken zeigt Fortschritt zum persönlichen Ziel
      - Punkte-Vergabe weiterhin nach Systemformel (ab 7.000 Schritten); persönliches Ziel ist Motivationsanker
    market_ref: MI-003
    notes: >
      41% der analysierten Apps bieten Custom Goals (docs/market-research/competitive-analysis.yaml).
      Steigert intrinsische Motivation für fortgeschrittene Nutzer (Persona Anna).

  # ═══════════════════════════════════════════════════════════════════
  # AKTIVITÄT / BEWEGUNGSTRACKING
  # ═══════════════════════════════════════════════════════════════════

  - id: REQ-P-011
    titel: Schritt-Tracking Android via Health Connect
    feature_ref: schritte-android
    prioritaet: P1-MVP
    status: implemented
    kategorie: aktivitaet
    beschreibung: >
      Die Android-App synchronisiert Tagesschritte automatisch aus Google Health Connect
      und vergibt Punkte nach der tiered Schritt-Formel.
    akzeptanzkriterien:
      - Schritte werden täglich automatisch im Hintergrund synchronisiert (Background Sync)
      - Schritte unter 4.000/Tag ergeben 0P; ab 4.000P schrittweise Bonusstufen
      - Max. 20.000 Schritte/Tag werden für die Punkte-Berechnung gezählt (Fraud-Cap)
      - Dedup: Pro Tag und User maximal 1 Ledger-Eintrag; Korrekturen via PATCH
      - Retroaktive Synchronisierung: letzte 90 Tage beim ersten Health-Connect-Connect
      - Health-Permission-Flow ist für Nutzer verständlich (Datenschutz-Hinweis vor Anfrage)
    foerdernachweis: >
      Implementiert März 2026 (Health Connect Integration). Produktiv seit April 2026.
      Code: src/lib/services/health.ts, src/lib/services/stepSync.ts,
      src/lib/server/stepsService.ts, src/routes/api/steps/sync/+server.ts.
    compliance_ref: dsgvo-art9-consent

  - id: REQ-P-012
    titel: Cardio-Tracking Android (Workouts via Health Connect)
    feature_ref: cardio-android
    prioritaet: P1-MVP
    status: implemented
    kategorie: aktivitaet
    beschreibung: >
      Die Android-App synchronisiert Workout-Sessions aus Google Health Connect und berechnet
      Äquivalenz-Minuten (moderat×1, intensiv×2) gegen gruppenspezifische Wochenziele.
    akzeptanzkriterien:
      - Unterstützte Workout-Typen: mindestens Laufen, Radfahren, Schwimmen, Fitness
      - Äquivalenz-Minuten: intensive Einheiten zählen doppelt (außer bei Gruppe 'pregnant')
      - Wochenziel-Punkte: adult/senior/pregnant: Start=50Min, Full=150Min; chronic: Start=35, Full=100
      - Dauer gecappt auf max. 4 Stunden pro Einheit (Fraud-Schutz)
      - Dedup via start_date (Option C: bei mehr Aktivität wird bestehender Eintrag überschrieben)
      - Cardio-Wochenkarte im Dashboard zeigt Fortschritt zur aktuellen ISO-Woche
    foerdernachweis: >
      Implementiert April 2026. Code: src/lib/services/cardioSync.ts,
      src/lib/server/cardioService.ts, src/routes/api/cardio/sync/+server.ts.
    compliance_ref: dsgvo-art9-consent

  - id: REQ-P-013
    titel: Background-Sync (Schritte, automatisch täglich)
    feature_ref: background-sync
    prioritaet: P1-MVP
    status: implemented
    kategorie: aktivitaet
    beschreibung: >
      Schritte werden täglich automatisch im Hintergrund synchronisiert, auch wenn die App
      nicht aktiv geöffnet ist. Kein manuelles „Sync"-Tippen erforderlich.
    akzeptanzkriterien:
      - Periodic Background Sync ist im Service Worker registriert (Tag: 'austrofit-step-sync')
      - Sync findet täglich auf Android Chrome statt
      - Falls Sync im Hintergrund nicht möglich: Dashboard-Open triggert Sync
      - Concurrency-Guard verhindert parallele Sync-Aufrufe
    foerdernachweis: >
      Implementiert März 2026. Code: src/service-worker.ts, src/lib/services/stepSync.ts.

  - id: REQ-P-014
    titel: iOS HealthKit Tracking
    feature_ref: ios-healthkit
    prioritaet: P2
    status: deferred
    kategorie: aktivitaet
    beschreibung: >
      Schritte und Workouts via Apple HealthKit (iPhone/iPad). Identische Funktionalität
      wie Android Health Connect.
    akzeptanzkriterien:
      - Schritte via HealthKit synchronisiert (täglich, retroaktiv 90 Tage)
      - Workouts via HealthKit synchronisiert (Intensitätsmapping analog Android)
      - Health Permission Flow auf iOS korrekt implementiert
      - iOS-Build via Capacitor: TestFlight veröffentlicht

  - id: REQ-P-048
    titel: Erweiterte Aktivitäts-Analytics (Fortschritts-Detailseite)
    prioritaet: P2
    status: deferred
    kategorie: aktivitaet
    beschreibung: >
      Nutzer sehen detaillierte Verlaufsanalysen ihrer Aktivitäten: Wochentrend,
      persönliche Bestleistungen und Entwicklung über Zeit.
    akzeptanzkriterien:
      - Wochenverlauf: Schritte und Cardio-Minuten der letzten 4–8 Wochen als Chart
      - Persönliche Bestleistungen: bester Schritttag, längster Streak, beste Cardio-Woche
      - Entwicklungs-Trend: Fortschritt über Monat/Quartal sichtbar
      - Integration in /mein-fortschritt oder neue Seite /aktivitaeten/verlauf
    market_ref: MI-011
    req_ref: REQ-U-006
    notes: >
      Runtopia (1M+ Downloads) zeigt: aktive Nutzer wollen Daten, nicht nur Punkte.
      Retention-Feature für fortgeschrittene Nutzer (Persona Anna).

  # ═══════════════════════════════════════════════════════════════════
  # BILDUNG / QUIZ
  # ═══════════════════════════════════════════════════════════════════

  - id: REQ-P-015
    titel: Gesundheitswegweiser (redaktionelle Artikel)
    feature_ref: gesundheitswegweiser-artikel
    prioritaet: P1-MVP
    status: implemented
    kategorie: bildung
    beschreibung: >
      SEO-optimierte Gesundheitsartikel im Directus CMS. Artikel sind der primäre
      Akquisitionskanal: Leser → Quiz → Registrierung.
    akzeptanzkriterien:
      - Artikel erreichbar via /artikel/[slug] und /gesundheitswegweiser/[slug]
      - Artikel werden aus Directus Collection 'articles' geladen (status='published')
      - Jeder Artikel kann ein eingebettetes Quiz enthalten
      - Artikel sind für Suchmaschinen indexierbar (kein Auth-Gate, SSR-freundlich)
      - Mindestens 250 Artikel und zugehörige Quizze im CMS vorhanden
    foerdernachweis: >
      250 Artikel + 250 Quizze importiert in Directus (März 2026).
      Frontend: src/routes/artikel/[slug]/+page.svelte.

  - id: REQ-P-016
    titel: Quiz (anonym, ohne Registrierung)
    feature_ref: quiz-anonym
    prioritaet: P1-MVP
    status: implemented
    kategorie: bildung
    beschreibung: >
      Nutzer können Quizze absolvieren ohne sich zu registrieren. Punkte werden angezeigt
      aber nicht vergütet – als Anreiz zur Registrierung.
    akzeptanzkriterien:
      - Quiz ist direkt nach Artikel-Lesen ohne Login verfügbar
      - Punkte werden nach Quiz-Abschluss angezeigt (Preview-Modus)
      - anonymous_id wird in localStorage gespeichert (keine Cookies)
      - Quiz-Versuch wird in Directus 'quiz_attempts' mit anonymous_id erfasst
      - 30-Tage-Cooldown gilt auch für anonyme Versuche (verhindert Spam)
    foerdernachweis: >
      Implementiert Februar 2026. Code: src/lib/components/singlepage/Quiz.svelte,
      src/routes/api/quiz-attempts/+server.ts.

  - id: REQ-P-017
    titel: Quiz (authentifiziert, mit Punktevergabe)
    feature_ref: quiz-authentifiziert
    prioritaet: P1-MVP
    status: implemented
    kategorie: bildung
    beschreibung: >
      Eingeloggte Nutzer erhalten Punkte für abgeschlossene Quizze. Punkte-Vergabe ist
      server-seitig validiert (keine Client-Manipulation möglich).
    akzeptanzkriterien:
      - Punkte werden nur bei eingeloggtem Nutzer vergeben (nie anonym)
      - Max. 200P pro Quiz (server-seitig gecappt)
      - passed-Flag wird server-seitig berechnet (score >= max_score), nie vom Client übernommen
      - max_score wird gegen Directus quiz_json.questions.length validiert (fail-closed)
      - Quiz-Punkte erscheinen im Ledger mit source_type='education'
      - Quiz-Streak-Boni werden nach Vergabe ausgelöst
    foerdernachweis: >
      Implementiert Februar 2026, Security-Hardening Mai 2026.
      Code: src/routes/api/quiz-attempts/+server.ts, src/routes/api/claim/+server.ts.

  - id: REQ-P-018
    titel: Quiz Claim-Flow (anonym → authentifiziert)
    feature_ref: quiz-claim-flow
    prioritaet: P1-MVP
    status: implemented
    kategorie: bildung
    beschreibung: >
      Wenn ein anonymer Quiz-Nutzer sich registriert oder einloggt, werden ausstehende
      Punkte automatisch seinem Konto gutgeschrieben.
    akzeptanzkriterien:
      - Anonymer Quiz-Versuch wird nach Login automatisch geclaimt
      - Pending-Claim wird in localStorage als PENDING_CLAIM_KEY gespeichert
      - Claim erfolgt über POST /api/claim mit Authorization-Header (kein Token im Body)
      - Punkte erscheinen nach Login sofort im Dashboard
      - Doppelter Claim desselben Versuchs ist nicht möglich
    foerdernachweis: >
      Implementiert Februar 2026, Security-Fix Mai 2026 (Token im Authorization-Header).
      Code: src/routes/api/claim/+server.ts, src/lib/components/singlepage/Quiz.svelte.

  - id: REQ-P-019
    titel: Quiz-Cooldown (30 Tage pro Quiz und User)
    feature_ref: quiz-cooldown
    prioritaet: P1-MVP
    status: implemented
    kategorie: bildung
    beschreibung: >
      Dasselbe Quiz kann pro Nutzer nicht öfter als einmal pro Cooldown-Zeitraum
      für Punkte absolviert werden (konfigurierbar in Directus, Standard: 30 Tage).
    akzeptanzkriterien:
      - Cooldown gilt pro Quiz und pro User (nicht global)
      - Cooldown wird doppelt geprüft: bei /api/quiz-attempts (anonym) UND /api/claim (per User)
      - Konfigurierbar via Directus 'cooldown_days'-Feld pro Quiz
      - Anonyme Identitäten können Cooldown nicht umgehen (per-User-Check bei Claim)
      - Nutzer sieht verständliche Fehlermeldung bei Cooldown-Überschreitung
    foerdernachweis: >
      Implementiert März 2026, Bypass-Fix Mai 2026.
      Code: src/routes/api/quiz-attempts/+server.ts, src/routes/api/claim/+server.ts.

  - id: REQ-P-020
    titel: Refresh-Quiz (nach 90 Tagen erneut Punkte)
    feature_ref: refresh-quiz
    prioritaet: P2
    status: deferred
    kategorie: bildung
    beschreibung: >
      Nach 90 Tagen kann dasselbe Quiz erneut absolviert werden und gibt wieder volle Punkte.
      Wissensvertiefung + wiederholter Reward-Mechanismus.
    akzeptanzkriterien:
      - 90-Tage-Refresh ist von 30-Tage-Cooldown getrennt (eigene Mechanik)
      - Klare Kommunikation im UI (Countdown bis Refresh verfügbar)

  # ═══════════════════════════════════════════════════════════════════
  # BELOHNUNG / MARKETPLACE
  # ═══════════════════════════════════════════════════════════════════

  - id: REQ-P-021
    titel: Direktpartner-Marketplace
    feature_ref: direktpartner-marketplace
    prioritaet: P1-MVP
    status: implemented
    kategorie: belohnung
    beschreibung: >
