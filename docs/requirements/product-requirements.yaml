  - id: REQ-P-049
    titel: "Gesundheitsziel 1 – Gesundheitsförderliche Lebens- und Arbeitsbedingungen"
    ziel_nr: 1
    feature_ref:
      - schritte-android
      - cardio-android
      - direktpartner-marketplace
    prioritaet: P1-MVP
    status: implemented
    kategorie: gesundheitsziele
    quelle: "https://gesundheitsziele-oesterreich.at/"
    business_plan_ref: "Business Plan Anhang A4"
    beschreibung: >
      AustroFit fördert Bewegung im Alltag durch niedrigschwelliges Schritt- und
      Cardio-Tracking mit Gamification-Anreizen. Der Partner-Marketplace bietet
      Zugang zu gesundheitsfördernden lokalen Angeboten. Der B2B-BGM-Kanal
      (REQ-P-047) ermöglicht zusätzlich betriebliche Gesundheitsförderung durch Arbeitgeber.
    akzeptanzkriterien:
      - Schritt-Tracking erfasst tägliche Alltagsbewegung (nicht nur Sport)
      - Cardio-Tracking unterstützt strukturierte Aktivitäten (Gehen, Laufen, Radfahren, Schwimmen)
      - Partner-Marketplace enthält gesundheitsfördernde Angebote (Fitnessstudios, Bewegungskurse)
      - B2B-BGM-Kanal ist technisch vorbereitet für Arbeitgeber-Integration
    req_ref: [REQ-P-011, REQ-P-012, REQ-P-021, REQ-P-047]

  - id: REQ-P-050
    titel: "Gesundheitsziel 2 – Gesundheitliche Chancengerechtigkeit"
    ziel_nr: 2
    feature_ref:
      - quiz-anonym
      - gesundheitswegweiser-artikel
      - schritte-android
    prioritaet: P1-MVP
    status: implemented
    kategorie: gesundheitsziele
    quelle: "https://gesundheitsziele-oesterreich.at/"
    business_plan_ref: "Business Plan Anhang A4"
    beschreibung: >
      AustroFit ist dauerhaft kostenlos, ohne Kaufverpflichtung und ohne soziale Eintrittshürde
      nutzbar. Bildungsangebote (Artikel, Quiz) stehen auch ohne Anmeldung zur Verfügung.
      Aktivitätsgruppen passen Ziele an individuelle Ausgangslage an — kein Standard-Ziel
      das gesundheitsferne Gruppen von vornherein ausschließt.
    akzeptanzkriterien:
      - Kernfunktionen sind dauerhaft ohne Entgelt nutzbar (keine Paywall)
      - Quiz und Artikel sind ohne Registrierung zugänglich (REQ-P-016, REQ-P-015)
      - Schrittzählung beginnt ab Schritt 1 — keine Mindestaktivität zum Einstieg
      - Aktivitätsgruppen (adult/senior/pregnant/chronic) passen Ziele an (REQ-P-030)
    req_ref: [REQ-P-016, REQ-P-015, REQ-P-030]

  - id: REQ-P-051
    titel: "Gesundheitsziel 3 – Gesundheitskompetenz der Bevölkerung stärken"
    ziel_nr: 3
