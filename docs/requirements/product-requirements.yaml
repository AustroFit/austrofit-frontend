    beschreibung: >
      AustroFit ist für Jugendliche ab 16 Jahren grundsätzlich adaptierbar.
      Kein dediziertes Jugend-Feature implementiert. Potenzial: angepasste Aktivitätsziele
      nach WHO-Empfehlungen für 5–17-Jährige (≥60 min/Tag), Schul-Challenges,
