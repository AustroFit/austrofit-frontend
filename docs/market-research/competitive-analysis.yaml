# AustroFit Competitive Analysis
# Source of Truth: Wettbewerbsanalyse aus AustroFit Business Plan v0.13 (August 2025)
# Ablage: docs/market-research/competitive-analysis.yaml
# Erstellt: 2026-05-24
#
# Cross-References:
#   maps_to_req  → docs/requirements/product-requirements.yaml (REQ-P-ID)
#                  "NEU" = noch kein REQ-P, sollte angelegt werden
#   maps_to_user → docs/requirements/user-requirements.yaml (REQ-U-ID)
#   competitor   → business-plan Kurzname (Quelle: austrofit-business-plan.yaml)

meta:
  titel: AustroFit Competitive Analysis
  version: "1.3"
  erstellt: "2026-05-24"
  aktualisiert: "2026-05-24"
  quelle: >
    AustroFit Business Plan v0.13 (August 2025), Abschnitt 4.5 + Anhang A6.
    Letzte Faktenprüfung: März 2026 (austrofit-business-plan.yaml v1.2).
    WebSearch-Verifizierung: 2026-05-24 (WeWard, Sweatcoin, Paceline, Cadoo).
  methodik: >
    24 Apps identifiziert nach AustroFit-Kriterien: Punktesystem + Belohnungen (kein
    reines Tracking). 11 Apps mit hoher Übereinstimmung in ≥1 Dimension detailliert bewertet.
    Exkludiert: Apps die nur Daten tracken und keine Belohnungen bieten.
  naechste_aktualisierung: "vor Phase-2-Launch (Community-Features)"

# ═══════════════════════════════════════════════════════════════════
# BEWERTUNGSSCHEMA
# ═══════════════════════════════════════════════════════════════════

bewertungsschema:
  "+++": "Hohe Übereinstimmung mit AustroFit-Feature (voll ausgebaut)"
  "+":   "Geringe Übereinstimmung (rudimentär oder als Nebenfeature)"
  "-":   "Nicht vorhanden"

dimensionen:
  - id: D-01
    name: Punktesystem
    beschreibung: "Strukturiertes System zur Punkte-Vergabe für definierte Aktivitäten"
  - id: D-02
    name: Gamification
    beschreibung: "Spielerische Elemente: Challenges, Badges, Leveling, Streaks, Maskottchen"
  - id: D-03
    name: Bewegung
    beschreibung: "Tracking von Bewegungsaktivitäten (Schritte, Laufen, Radfahren, etc.)"
  - id: D-04
    name: Bildung
    beschreibung: "Gesundheitsinhalte: Artikel, Quizze, Wissensvermittlung"
  - id: D-05
    name: Community
    beschreibung: "Soziale Features: Events, Bestenliste, Schreiben & Kommentieren, Connecten"
  - id: D-06
    name: Belohnungssystem
    beschreibung: "Einlösbare Vorteile bei Partnern oder als Geldwert"

# ═══════════════════════════════════════════════════════════════════
# APPS – HOCH ÜBEREINSTIMMEND (11 von 24)
# ═══════════════════════════════════════════════════════════════════

hoch_uebereinstimmend:
  beschreibung: >
    11 Apps mit hoher Übereinstimmung in ≥1 Dimension. Details + Insights pro App.
    Quelle für Downloads/Umsatz: Business Plan A6 (Stand August 2025).

  apps:

    - id: C-01
      name: Pandocs
      url: "https://www.pandocs.com/de/"
      typ: "Betriebliche Gesundheitsförderung (BGF)"
      herkunft: Österreich
      downloads_google_play: "5K+"
      umsatz: "nicht publik"
      scoring:
        punktesystem: "+++"
        gamification: "+++"
        bewegung: "+"
        bildung: "+++"
        community: "+++"
        belohnungssystem: "+"
      key_insights:
        - "Vollständiges BGF-Paket (Punkte + Gamification + Bildung + Community) im B2B-Kontext"
        - "Kein starkes Belohnungssystem trotz hohem Engagement – B2B zahlt direkt für die Plattform"
        - "Österreichischer Anbieter: zeigt lokale Marktakzeptanz für gamifizierte Gesundheitsapps"
      austrofit_implication: >
        BGF/Corporate-Wellness-Segment ist unbesetzt für B2C-Plattformen.
        AustroFit könnte Unternehmen als 'Arbeitgeber-Gesundheitspaket' anbieten (B2B2C).
        Pandocs ist potenzieller Kooperations- nicht Konkurrenzpartner.
      maps_to_req: [REQ-P-040, REQ-P-041]

    - id: C-02
      name: Optimity
      url: "https://www.myoptimity.com/"
      typ: "Health & Rewards"
      herkunft: Kanada
      downloads_google_play: "100K+"
      funding_mio_usd: 6.05
      scoring:
        punktesystem: "+++"
        gamification: "+"
        bewegung: "+++"
        bildung: "+++"
        community: "+"
        belohnungssystem: "-"
      key_insights:
        - "Trotz starker Bewegungs- und Bildungsfeatures KEIN Belohnungssystem → Gap"
        - "100K+ Downloads zeigen: Nutzer wollen mehr als reines Tracking"
        - "Ohne Gamification-Tiefe und ohne Rewards ist die Retention schwach"
      austrofit_implication: >
        Validiert AustroFits Thesis: Bildung + Bewegung allein reicht nicht.
        Das Belohnungssystem ist der entscheidende Differenziator gegenüber Optimity.
      maps_to_req: [REQ-P-021, REQ-P-022]

    - id: C-03
      name: WeWard
      url: "https://www.wewardapp.com/de"
      typ: "Reward-for-Steps"
      herkunft: Frankreich
      downloads_google_play: "25M+"  # Aktualisiert Mai 2026 (war 10M+ in Business Plan Aug 2025)
      umsatz_mio_usd: ">10"           # BusinessOfApps: "eight figures" (10–99M) — Business Plan-Schätzung bestätigt
      funding_2025_mio_usd: 20
      stand_verifiziert: "2026-05-24"
      scoring:
        punktesystem: "+"
        gamification: "+++"
        bewegung: "+"
        bildung: "-"
        community: "+++"
        belohnungssystem: "+++"
      key_insights:
        - "25M+ Downloads Mai 2026 (Wachstum von 10M+ → 25M+ in ~9 Monaten: +150%)"
        - "Venus Williams Investment Feb 2025 → signifikanter Celebrity-Endorsement"
        - "B2B-Modell: Unternehmen zahlen für gebrandete Step-Challenges (ohne eigenes Belohnungsbudget)"
        - "Keine Bildung – zeigt dass Rewards + Community schon für Masse reichen"
        - "$20M VC-Runde 2025 + Venus-Williams-Investment bestätigt Investor-Vertrauen in Reward-for-Steps"
      austrofit_implication: >
        Beweist globale Skalierbarkeit des Reward-for-Steps-Modells — WeWard wächst exponentiell.
        AustroFit kann WeWard mit Bildung + regionalem Fokus + DSGVO-Transparenz übertreffen.
        Community-Features (REQ-P-025/026) sind für virales Wachstum kritisch.
        WeWards Wachstum (+150% in 9 Monaten) zeigt: Reward-for-Steps-Markt ist noch nicht gesättigt.
      maps_to_req: [REQ-P-025, REQ-P-026, REQ-P-027]

    - id: C-04
      name: SPAR Health Coach
      url: "https://apps.apple.com/at/app/spar-health-coach/id952788997"
      typ: "Retail-Wellness"
      herkunft: Österreich
      downloads_google_play: "10K+"
      umsatz: "Teil von SPAR AT (Umsatz 2024: 21,4 Mrd €)"
      scoring:
        punktesystem: "+++"
        gamification: "+"
        bewegung: "+++"
        bildung: "-"
        community: "-"
        belohnungssystem: "-"
      key_insights:
        - "Österreichischer Retail-Kontext validiert lokale Marktbereitschaft"
        - "Kein Community-Feature und keine externen Rewards trotz SPAR-Ökosystem"
        - "Zeigt: Retailer nutzen Gesundheits-Apps zur Kundenbindung (B2B-Kanal)"
      austrofit_implication: >
        Österreichischer Markt für Gesundheits-Apps ist validiert.
        SPAR als potenzieller Direktpartner (Lebensmittel-Kategorie im Marketplace).
        AustroFit bietet deutlich mehr Tiefe als der SPAR Health Coach.
      maps_to_req: [REQ-P-021, REQ-P-023]

    - id: C-05
      name: moveeffect
      url: "https://moveeffect.com/"
      typ: "B2B BGM (Betriebliche Gesundheitsförderung)"
      herkunft: Österreich
      downloads_google_play: "10K+"
      funding_seed_usd: 145_000
      scoring:
        punktesystem: "+++"
        gamification: "+"
        bewegung: "+"
        bildung: "+"
        community: "+++"
        belohnungssystem: "-"
      key_insights:
        - "Österreichischer B2B-BGM-Anbieter: Community ohne Rewards funktioniert in B2B"
        - "Seed-Funding €145K zeigt: Bootstrapped-Ansatz im AT-Markt möglich"
        - "Kein Belohnungssystem – B2B-Firmen zahlen für die Community-Plattform"
      austrofit_implication: >
        B2B-BGM ist ein valider zweiter Markt neben B2C.
        AustroFit könnte ein 'Team-Challenge'-Feature für Unternehmen anbieten (Phase 2).
        Österreichischer Mitbewerber – Kooperation statt Konkurrenz möglich.
      maps_to_req: [REQ-P-040]

    - id: C-06
      name: Cadoo
      url: "https://www.cadoo.io/"
      typ: "Fitness-Gaming mit Wett-Challenges"
      herkunft: USA
      downloads_google_play: "10K+"
      funding_seed_mio_usd: 1.5
      scoring:
        punktesystem: "+"
        gamification: "+++"
        bewegung: "+++"
        bildung: "-"
        community: "+"
        belohnungssystem: "-"
      key_insights:
        - "Echtes Geld als Einsatz für Fitness-Challenges steigert Commitment stark"
        - "Modell funktioniert für intrinsisch motivierte Nutzer, schreckt aber Einsteiger ab"
        - "GSpG-Risiko bei Einsatz-Mechanik – für AustroFit nicht direkt umsetzbar"
      austrofit_implication: >
        Commitment-Mechanik ist wertvoll, aber Geld-Einsatz ist GSpG-riskant (REQ-R-024).
        Alternative: Punkte-Einsatz für Challenges (verliere deine Punkte wenn Ziel verfehlt)
        ohne Kaufverpflichtung. Zeigt hohe Wirksamkeit von 'Stakes' in Challenges.
      maps_to_req: [REQ-P-009]
      compliance_note: "Geld-Wetten → GSpG (REQ-R-024). Punkte-Einsatz ohne Kaufpflicht = legal."

    - id: C-07
      name: Evidation
      url: "https://evidation.com/"
      typ: "Health Research & Rewards"
      herkunft: USA
      downloads_google_play: "1M+"
      umsatz_jahres_mio_usd: 36.1
      scoring:
        punktesystem: "+++"
        gamification: "-"
        bewegung: "+"
        bildung: "+"
        community: "+"
        belohnungssystem: "-"
      key_insights:
        - "$36M Jahresumsatz durch B2B-Forschungspartnerschaften (kein B2C-Monetarisierung)"
        - "Nutzer spenden Daten für Forschung und erhalten dafür Punkte"
        - "Kein Gamification – zeigt dass Forschungs-Segment andere Motivation hat"
      austrofit_implication: >
        Forschungspartnerschaften (Universitäten, Gesundheitsfonds) sind ein langfristiger
        B2G-Umsatzkanal. Impact Analytics API (REQ-P-044) ist der AustroFit-Weg dorthin.
      maps_to_req: [REQ-P-044]

    - id: C-08
      name: Sweatcoin
      url: "https://sweatco.in/"
      typ: "Reward-for-Steps"
      herkunft: UK
      downloads_google_play: "100M+"
      registrierte_nutzer_mio: 200    # Claimed "200M+", aber aktive Nutzer deutlich niedriger
      downloads_2025_mio: 22.5        # Verifiziert Mai 2026: deutliches Wachstums-Verlangsamung
      umsatz_jahres_mio_usd: 21       # Verifiziert Mai 2026: rückläufig (war 32.7M in Business Plan Aug 2025)
      umsatz_historisch_mio_usd: 32.7 # Business Plan Aug 2025 (BusinessOfApps 2024-Schätzung)
      stand_verifiziert: "2026-05-24"
      scoring:
        punktesystem: "+"
        gamification: "+++"
        bewegung: "+"
        bildung: "-"
        community: "-"
        belohnungssystem: "-"
      key_insights:
        - "200M+ Claimed-Nutzer, aber Umsatz fiel von $32.7M auf ~$21M → Monetarisierungsproblem"
        - "22.5M Downloads in 2025 zeigt deutliche Wachstumsabschwächung gegenüber Vorjahren"
        - "SWEAT-Token/Crypto-Ansatz (eigene Währung) hat Komplexität hinzugefügt ohne Mehrwert"
        - "Schritt-zu-Coin-Animation bleibt zentraler Dopamin-Trigger – UI-Lektion für AustroFit"
        - "Kein echtes Belohnungssystem (nur Markendeals + Werbung) limitiert Monetarisierungspotenzial"
      austrofit_implication: >
        Warnsignal: Reines Schritt→Währung-Modell ohne echtes Belohnungssystem verliert Monetarisierungskraft.
        AustroFit-Vorteil: Echte, einlösbare Rewards bei regionalen Partnern + Bildung + Gamification
        als nachhaltiges Retention-Modell — nicht reine Krypto-Währungsspekulaton.
        Animations-Feedback bei Punkteevergabe übernehmen (Schritt-zu-Coin-Effekt).
      maps_to_req: [REQ-P-001, REQ-P-005]

    - id: C-09
      name: BetterPoints
      url: "https://www.betterpoints.ltd/"
      typ: "Mobility & Climate Rewards"
      herkunft: UK
      downloads_google_play: "100K+"
      umsatz_jahres_mio_usd: 2.1
      funding_usd: 186_000
      scoring:
        punktesystem: "+"
        gamification: "+"
        bewegung: "+++"
        bildung: "-"
        community: "+"
        belohnungssystem: "-"
      key_insights:
        - "Nachhaltigkeits-/Klimafokus bei Rewards: Punkte für aktive Mobilität (kein Auto)"
        - "Stadtpartnerschaften (öffentlicher Nahverkehr, Gemeinden) als B2G-Kanal"
        - "Niedrige Funding-Basis trotz UK-Markt – zeigt Bootstrap-Viabilität"
      austrofit_implication: >
        Nachhaltigkeits-Winkel passt zu AustroFits ESG-Positionierung.
        Kooperation mit Wiener Linien oder 'Wien zu Fuß' als Stadtpartner möglich (B2G).
        ESG-Filter im Marketplace (REQ-P-023) ist direkter Differenziator.
      maps_to_req: [REQ-P-023, REQ-P-042]

    - id: C-10
      name: Runtopia
      url: "https://www.runtopia.net/de"
      typ: "Run-Tracker mit Rewards"
      herkunft: China
      downloads_google_play: "1M+"
      umsatz: "nicht publik"
      scoring:
        punktesystem: "+"
        gamification: "+"
        bewegung: "+++"
        bildung: "-"
        community: "+"
        belohnungssystem: "-"
      key_insights:
        - "Detaillierte Lauf-Analytics (Pace, Route, Herzfrequenz) binden aktive Läufer"
        - "Rewards nur als Gutscheine ohne Fokus auf Gesundheitsförderung"
        - "Zeigt: ernsthafte Sportler wollen Daten, nicht nur Punkte"
      austrofit_implication: >
        Aktive Nutzer (Anna, Walter) wollen Fortschritts-Details, nicht nur Punkte.
        Detailliertere Aktivitäts-Analytics auf /mein-fortschritt könnten Retention steigern.
        Cardio-History-Seite (/cardio) als Differenziator weiterentwickeln.
      maps_to_req: [REQ-P-012]

    - id: C-11
      name: Paceline
      url: "https://paceline.fit/"
      typ: "iOS App + Wellness-Rewards (Herzfrequenz → Punkte für Marken-Rabatte)"
      herkunft: USA
      app_store_bewertungen: "18K+"
      funding_gesamt_mio_usd: 54.9
      umsatz_jahres_mio_usd: 11.5
      stand_verifiziert: "2026-05-24"
      scoring:
        punktesystem: "+"
        gamification: "+"
        bewegung: "+++"
        bildung: "-"
        community: "-"
        belohnungssystem: "+"
      key_insights:
        - "MODELLWECHSEL (verifiziert Mai 2026): Keine finanziellen Belohnungen mehr — jetzt Punkte für Wellness-Marken-Rabatte (ähnlich AustroFit-Modell)"
        - "Business Plan (Aug 2025) beschrieb noch das ursprüngliche Finanz-Rewards-Modell — überholt"
        - "$54.9M Funding bestätigt: Investor-Vertrauen in Activity→Reward-Modell bleibt stark"
        - "Nur iOS – Android-Lücke; AustroFit hat hier direkten Vorteil"
        - "Herzfrequenz-Tracking als Aktivitäts-Qualitätsmesser (statt nur Schritte) — differenzierter Ansatz"
      austrofit_implication: >
        Strategisch relevant: Paceline bewegt sich in Richtung AustroFit-Modell (Punkte → Wellness-Rabatte).
        Konvergenz bestätigt AustroFits Modell-Thesis. AustroFit-Vorteile: Android-Support + Bildung +
        lokale Partner + DSGVO.
        B2G-Weg (SVS-Gesundheitshunderter) bleibt als Phase-3-Option: Aktivitätsnachweise exportierbar machen.
      maps_to_req: [REQ-P-042, REQ-P-043]

# ═══════════════════════════════════════════════════════════════════
# APPS – ÖSTERREICHISCHE HERKUNFT (NICHT IN HOCH-ÜBEREINSTIMMEND)
# ═══════════════════════════════════════════════════════════════════

oesterreichische_apps:
  beschreibung: >
    Apps aus Österreich oder spezifisch für den österreichischen Markt entwickelt.
    Pandocs und moveeffect sind bereits unter hoch_uebereinstimmend erfasst.

  apps:

    - id: C-12
      name: "Generali Vitality"
      typ: "Private Krankenversicherungs-Wellness (Generali AT)"
      herkunft: Österreich
      versicherte_gesamt: "Teil von Generali AT (3,5M Versicherte)"
      key_insights:
        - "Versicherungs-Wellness-Modell: Aktivität → Prämienrabatt – etablierter AT-Kanal"
        - "Geschlossenes System: nur für Generali-Versicherte → keine direkte Konkurrenz für B2C"
        - "Zeigt: PKV-Versicherte zahlen für gamifizierte Gesundheits-Incentives"
      austrofit_implication: >
        Kooperations-Potenzial: Generali als Direktpartner (PKV-Vergünstigung als Reward).
        Oder: AustroFit-Nachweise als Input für Generali-Vitality-Punkte (Schnittstellenidee).
      maps_to_req: [REQ-P-042]

    - id: C-13
      name: "Wien zu Fuß"
      typ: "Öffentliche Gesundheitsinitiative (Stadt Wien)"
      herkunft: Österreich (Wien)
      key_insights:
        - "Stadtgeförderte Initiative: kein Reward-System, kein Gamification"
        - "Zeigt: Öffentliche Hand investiert in Bewegungsförderung ohne digitale Tools"
        - "Kooperations-Potenzial für B2G-Pilotprojekt mit Stadt Wien"
      austrofit_implication: >
        B2G-Pilotpartner-Kandidat für Phase 3. AustroFit könnte 'Wien zu Fuß'-
        Challenges digitalisieren und gamifizieren (Gemeinde zahlt für Impact).
      maps_to_req: [REQ-P-042, REQ-P-044]

    - id: C-14
      name: "Mavie Move"
      typ: "Versicherungs-Wellness (UNIQA AT)"
      herkunft: Österreich
      key_insights:
        - "UNIQA-Pendant zu Generali Vitality: Bewegung → Versicherungsvorteile"
        - "Zeigt: Beide großen AT-Versicherer haben eigene Wellness-Apps"
        - "Geschlossenes System – nur für UNIQA-Kunden"
      austrofit_implication: >
        Versicherungs-Wellness ist in AT etabliert aber immer geschlossen (nur eigene Kunden).
        AustroFit als offene Plattform ist das neutrale Gegenstück – kann mit beiden kooperieren.
      maps_to_req: [REQ-P-042]

