# USER SENTIMENT — WETTBEWERBS-REVIEWS
# Quellen: App Store / Google Play / Trustpilot / Visu Network / BudgetDiet
# Letzte Erhebung: 2026-05-24 (WebSearch)
# Hinweis: Enthält nur Wettbewerb-Feedback. AustroFit-eigenes Feedback
# (In-App-Ratings, NPS) nach Go-Live hier einzupflegen.
# ═══════════════════════════════════════════════════════════════════

user_sentiment:

  # ── WeWard (C-03) ──────────────────────────────────────────────
  - competitor: C-03
    name: WeWard
    rating_app_store: 4.0
    quelle: "justuseapp.com / trustpilot.com / thebudgetdiet.com (Stand Mai 2026)"
    hauptkritikpunkte:
      - "Schritt-Tracking-Lücken: 4.000–8.000 Schritte täglich fehlen trotz Handy in der Tasche"
      - "Kein Apple Watch-Support — Nutzer müssen Handy immer mitführen"
      - "Manuelle Schritte-Konvertierung täglich nötig (nicht automatisch)"
      - "Sehr langsames Earning: ~1 Jahr für $15 bei reinem Step-Walking"
      - "Customer Support ghostet bei Reward-Problemen tagelang"
      - "Reward-Auslieferung (z.B. gewonnenes iPhone 17) mit wochenlangen Verzögerungen"
    positives:
      - "Eindeutig legitim — zahlt tatsächlich aus"
      - "Macht Spaß als Motivationsapp, Gamification-Elemente motivieren"
      - "Community-Features (Challenges, Ranglisten) sind beliebt"
    austrofit_implication:
      - "Automatischer, zuverlässiger Schritt-Sync ist ein echter Differenziator — kein manuelles Trigger-Klicken"
      - "Klare Kommunikation wie viel Punkte wie schnell erreichbar sind (Erwartungs-Management)"
      - "Support-Reaktionszeit ist ein Vertrauens-Faktor — auch als kleines Team erreichbar sein"

  # ── Sweatcoin (C-08) ───────────────────────────────────────────
  - competitor: C-08
    name: Sweatcoin
    rating_app_store: 4.4
    rating_google_play: 4.3
    quelle: "trustpilot.com / visu.network / paidsurveys.net (Stand Mai 2026)"
    hauptkritikpunkte:
      - "Earning-Wert extrem niedrig: unter $1/Jahr an tatsächlich einlösbarem Wert"
      - "Rewards sind meist Trials und Rabatt-Aktionen — keine 'echten' Belohnungen"
      - "Indoor-Schritte werden nicht gezählt"
      - "Coins verschwinden ohne Erklärung (Nutzer verliert 4.000 angesammelte Coins)"
      - "SWEAT-Token/Krypto unklar für Durchschnittsnutzer — kein verständlicher Wert"
      - "Customer Support unerreichbar bei Problemen"
      - "Zahlungsverzögerungen (PayPal-Auszahlung 7+ Tage statt versprochener 3)"
      - "Battery-Drain durch dauerhaftes GPS-Tracking"
    positives:
      - "Hohe Ratings trotz Beschwerden — Gamification-Erlebnis funktioniert"
      - "Konzept 'Schritte = Währung' ist intuitiv verständlich"
      - "Animation beim Schritt→Coin-Feedback als Dopamin-Trigger gut umgesetzt"
    austrofit_implication:
      - "KRITISCH: 'Rewards sind nur Trials/Rabatte, kein echter Wert' ist das Hauptproblem bei Wettbewerbern — AustroFits echte Partner-Rewards sind ein starker USP"
      - "Coins/Punkte die verschwinden = sofortiger Vertrauensverlust — Ledger-Transparenz wichtig"
      - "Keine Krypto-Komplexität — Punkte sollen intuitiv und direkt verständlich sein"
      - "Schritt-Animations-Feedback übernehmen (was gut funktioniert), Reward-Substanz verbessern"

  # ── Pandocs (C-01) ─────────────────────────────────────────────
  - competitor: C-01
    name: Pandocs
    quelle: "pandocs.com / App Store AT / netzwerk-bgf.at (Stand Mai 2026)"
    hauptkritikpunkte:
      - "Wenig öffentliche Negativbewertungen (B2B-Kontext → Nutzer bewerten selten öffentlich)"
      - "B2B-Abhängigkeit: App nur nutzbar wenn Arbeitgeber Pandocs-Kunde ist"
    positives:
      - "Ganzheitlicher Ansatz (Fitness + Mentale Gesundheit + Ernährung) wird explizit gelobt"
      - "Gamification für 'kleine wichtige Dinge wie tägliche Schritte' als motivierend bewertet"
      - "Datenschutz (EU-Server, Österreich) aktiv als Vertrauensmerkmal kommuniziert und gut aufgenommen"
      - "Österreich-Fokus und regionale Relevanz als positiver Unterschied zu internationalen Apps"
    austrofit_implication:
      - "Ganzheitlicher Ansatz (Körper + Geist) resoniert bei Nutzern — AustroFit-Bildungsfeature ist richtig positioniert"
      - "DSGVO und EU-Server aktiv kommunizieren — Nutzer schätzen das, besonders im DACH-Raum"
      - "Österreich-Identität als Vertrauensanker nutzen (REQ-P-040)"

  # ── moveeffect (C-02) ──────────────────────────────────────────
  - competitor: C-02
    name: moveeffect
    quelle: "moveeffect.com / bgm-vergleich.de / LinkedIn AT (Stand Mai 2026)"
    hauptkritikpunkte:
      - "Kaum öffentliche Nutzerbewertungen verfügbar (B2B-Plattform, kein Consumer-App-Store-Fokus)"
    positives:
      - "10 Jahre Markterfahrung — etablierter BGF-Anbieter in Österreich"
      - "Zweiter Standort Wien 2021 zeigt Wachstum"
      - "KPI-Tracking und BGM-Analytics für Unternehmenskunden als Mehrwert"
    austrofit_implication:
      - "moveeffect ist kein direkter Wettbewerber im B2C-Segment — eher Referenz für B2B-BGM (REQ-P-047)"

  # ── Übergreifende Muster (alle Apps) ───────────────────────────
  uebergreifende_muster:
    quelle: "Synthesis aus WeWard, Sweatcoin, Visu Network, myroomismyoffice.com (Mai 2026)"
    top_beschwerden_industrie:
      - rang: 1
        muster: "Zu niedriges Earning — 'nicht die Zeit wert'"
        frequenz: "sehr häufig (WeWard, Sweatcoin, Cash Walk, Macadam)"
        austrofit_relevanz: >
          Klare Onboarding-Kommunikation: Was ist realistisch in Woche 1, Monat 1?
          Erste Punkte schnell verdienen (Milestone-Bonus bei Registrierung + erstem Quiz).
      - rang: 2
        muster: "Rewards sind Trials/Rabatte, kein echter Wert"
        frequenz: "sehr häufig (Sweatcoin dominant)"
        austrofit_relevanz: >
          AustroFits direkt einlösbare Partner-Rewards (Gutscheine, Produkte) sind ein
          echter Differenziator. In Onboarding und Marketing prominent kommunizieren.
      - rang: 3
        muster: "Schritt-Tracking-Probleme (Sync, Smartwatch, Indoor)"
        frequenz: "häufig (WeWard, Sweatcoin)"
        austrofit_relevanz: >
          Zuverlässigkeit des Schritt-Syncs ist Basis-Vertrauen. Probleme hier kosten
          mehr Vertrauen als jede Community-Feature gewinnt.
      - rang: 4
        muster: "Customer Support unerreichbar"
        frequenz: "häufig (WeWard, Sweatcoin)"
        austrofit_relevanz: >
          Auch als kleines Team: E-Mail-Antwort innerhalb 48h als Standard.
          FAQ + transparente Kommunikation bei bekannten Problemen.
      - rang: 5
        muster: "Vertrauensverlust durch verschwundene Coins/Punkte"
        frequenz: "mittel (Sweatcoin)"
        austrofit_relevanz: >
          Ledger-Transparenz ist Pflicht. Nutzer müssen jeden Punkt nachvollziehen können
          (/mein-fortschritt zeigt bereits Ledger — weiter ausbauen).
    uster_die_funktionieren:
      - "Animations-Feedback bei Punktevergabe (Dopamin-Trigger) — WeWard, Sweatcoin"
      - "Ganzheitlicher Ansatz Körper+Geist — Pandocs"
      - "Österreich/Datenschutz als explizites Vertrauensmerkmal — Pandocs"
      - "Community Challenges als Engagement-Treiber — WeWard"

