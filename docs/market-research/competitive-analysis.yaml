# ═══════════════════════════════════════════════════════════════════
# ÖSTERREICH-KONTEXT — NATIONALE RELEVANZ INTERNATIONALER ERKENNTNISSE
# Quellen: Statista AT 2021–2024, Businessplan v0.13, Comparis 2025,
#          Handelszeitung/Livv 2024, AIHTA, BMWKMS, quickbirdmedical.com
# Letzte Erhebung: 2026-05-24 (WebSearch + Businessplan-Auswertung)
# ═══════════════════════════════════════════════════════════════════

oesterreich_kontext:

  # ── Marktgröße & App-Nutzung ────────────────────────────────────
  marktdaten:
    smartphone_nutzer_18_64: "5,5 Mio."                  # Business Plan v0.13
    fitness_app_nutzer_2022: "1,8 Mio."                   # Statista AT
    gesundheits_fitness_app_nutzung_generell_pct: 29      # Statista 2021
    nutzung_unter_30_pct: 46                              # Statista 2021 (15–29 J.)
    kostenpflichtige_apps_genutzt_pct: 9.1                # Statista 2023 (16–74 J.)
    marktvolumen_2024_mio_eur: 15.8                       # Statista-Prognose
    marktvolumen_2027_mio_eur: 21.0                       # Statista-Prognose, CAGR 10.3%
    top_app_google_play_fitness_aug2024: "Komoot (hike, bike & run)"  # Statista AT
    vorsorge_nutzung_pct: 15                              # Business Plan (nur 1,08 Mio. nutzen Vorsorgeangebote)
    praevention_anteil_gesundheitsausgaben_pct: 5         # Business Plan (1,8 Mrd. € von 35+ Mrd.)
    schlussfolgerung: >
      Nur 9% zahlen für Gesundheits-Apps → Free-to-use ist Pflicht, keine Paywall.
      Nur 15% nutzen Vorsorgeangebote → riesiger unteradressierter Markt.
      Top-App ist Komoot (Wandern/Radfahren) → österreichische Aktivitätskultur ist outdoor-geprägt,
      nicht nur urban-steps-basiert.

  # ── Datenschutz & Vertrauen ─────────────────────────────────────
  datenschutz_und_vertrauen:
    vertrauen_datenschutz_generell_pct: 81               # Comparis Datenvertrauensstudie 2025
    bedenken_handynummer_online_pct: 45.4                # Comparis 2025
    dsb_beschwerden_2025: 5300                           # DSB Tätigkeitsbericht 2025
    diga_rahmen: >
      Österreich schafft bis Ende 2026 rechtlichen Rahmen für digitale Gesundheitsanwendungen (DiGAs);
      ab 2027 verschreibbar durch Ärzte (quickbirdmedical.com 2026).
    schlussfolgerung: >
      Österreicher vertrauen Datenschutz grundsätzlich (81%), aber wachsende DSB-Beschwerden
      (5.300 in 2025) zeigen aktives Datenbewusstsein. Transparenz und EU-Server sind keine
      Nice-to-have — sie sind aktive Vertrauensmerkmale die kommuniziert werden müssen.
      DiGA-Rahmen ab 2027 ist langfristiger strategischer Kanal (B2G-Phase 3).

  # ── Kulturelle Faktoren ─────────────────────────────────────────
  kulturelle_faktoren:
    aktivitaetskultur:
      beschreibung: >
        Österreichische Fitness-/Bewegungskultur ist stark outdoor-geprägt: Wandern, Radfahren,
        Skifahren, Bergsteigen. Komoot als #1 Fitness-App bestätigt das. "Steps" allein greift
        zu kurz — AustroFit tracked bereits Schritte + Cardio (Laufen, Radfahren), was zur
        Aktivitätskultur passt.
      austrofit_relevanz: >
        Cardio-Tracking (REQ-P-012) ist in Österreich wichtiger als in reinen Step-Apps.
        Content-Strategie (Bildungsartikel) sollte Outdoor-Aktivitäten priorisieren.

    skeptizismus_gegenueber_zu_guten_angeboten:
      beschreibung: >
        Österreichisch-deutschen Nutzer sind bekannt skeptisch gegenüber "earn money for walking"
        Versprechen. Sweatcoin und WeWard performen in DACH deutlich schlechter als in
        angelsächsischen Märkten — der "too good to be true"-Filter ist aktiv.
      austrofit_relevanz: >
        Messaging vermeiden wie "Geld verdienen durch Gehen". Stattdessen: "Gesund leben und
        dafür belohnt werden bei Partnern, die du kennst". Regionale, bekannte Partner
        bauen Glaubwürdigkeit auf die internationale Apps nicht haben.

    vertrauen_in_lokale_marken:
      beschreibung: >
        Österreicher vertrauen lokalen und bekannten Marken mehr als globalen Plattformen
        (SPAR Health Coach, Generali Vitality trotz geringer Features etabliert).
        Ein österreichischer Gründer (Johannes Gnong, Wien) ist ein aktives Vertrauensmerkmal.
      austrofit_relevanz: >
        "Made in Austria" und "Gründer aus Wien" prominent kommunizieren. Österreichische
        Partner-Logos in Onboarding zeigen. DSGVO und EU-Server explizit erwähnen.

    niederschwelligkeit_als_pflicht:
      beschreibung: >
        App richtet sich bewusst auch an Menschen mit wenig Berührung mit Prävention oder
        Digitaltechnologie (Business Plan explizit). Walter-Persona (55+) ist ein Kernziel,
        nicht ein Randfall. WCAG 2.1 AA-Konformität bereits im Business Plan verankert.
      austrofit_relevanz: >
        UX muss für beide Extrema funktionieren: Anna (20, digital-native) und Walter (55+,
        wenig Digitalkompetenz). Accessibility-Features sind in Österreich besonders wichtig
        da Altersdurchschnitt höher und Digitalisierungsgrad niedriger als in Nordeuropa.

    gemeinschaftsorientierung:
      beschreibung: >
        Österreich hat starke Gemeinschafts- und Vereinskultur. Gesundheitsziel 5 (Sozialer
        Zusammenhalt) ist staatliches Ziel — Community-Features resonieren kulturell stärker
        als in individualistischeren Märkten.
      austrofit_relevanz: >
        Community-Features (Post-Go-Live) haben in Österreich kulturellen Rückenwind.
        Vereinsintegration und Gemeinde-Challenges könnten ein einzigartiger B2G-Kanal sein.

  # ── Institutionelle Verankerung (AustroFit-spezifisch) ─────────
  institutionelle_verankerung:
    beschreibung: >
      AustroFit ist eng an österreichische Institutionen und Programme anschlussfähig —
      kein internationaler Wettbewerber hat diesen strukturellen Vorteil.
    programme:
      - name: "Gesundheitsziele Österreich"
        relevanz: "Ziel 3 (Gesundheitskompetenz), Ziel 5 (Sozialer Zusammenhalt), Ziel 8 (Bewegung im Alltag)"
        vorteil: "Fördernachweis-Hebel für FFG/aws/WA Wien. Kein internationaler Wettbewerber referenziert das."
      - name: "SVS Gesundheitshunderter"
        relevanz: "Bis zu €120 Bonus für nachgewiesene Präventionsmaßnahmen"
        vorteil: "Aktivitätsnachweise aus AustroFit direkt nutzbar (Phase 3, REQ-P-043)"
      - name: "BGF-Förderung WKO/GKK"
        relevanz: "Österreichische Unternehmen haben Budgets für betriebliche Gesundheitsförderung"
        vorteil: "B2B-BGM-Kanal (REQ-P-047) — kein internationaler Wettbewerber erschließt das"
      - name: "DiGA-Rahmen (ab 2027)"
        relevanz: "Digitale Gesundheitsanwendungen verschreibbar durch Ärzte ab 2027"
        vorteil: "Langfristiger B2G-Kanal; frühzeitige Positionierung relevant"
      - name: "AIHTA-Studie"
        relevanz: "Österreichisches Institut belegt: Gamification-Elemente tragen signifikant zur Verhaltensänderung bei"
        vorteil: "Wissenschaftlicher Nachweis aus AT-Kontext für Förderanträge"
      - name: "BMWKMS-Bewegungsempfehlungen"
        relevanz: "≥150 min moderate Aktivität/Woche als offizielle Empfehlung"
        vorteil: "AustroFit-Tagesziele sind an offizielle Empfehlungen geknüpft — schafft Legitimität"

  # ── Übertragbarkeits-Assessment: Was gilt für Österreich? ──────
  internationaler_vergleich_uebertragbarkeit:
    gut_uebertragbar:
      - insight: "Reward-for-Steps funktioniert (WeWard, Sweatcoin belegen Modell-Viabilität)"
        einschraenkung: "Wachstumszahlen nicht direkt übertragbar — DACH-Markt ist kleiner und skeptischer"
      - insight: "Gamification (Challenges, Badges, Streaks) steigert Engagement (82% der Apps)"
        einschraenkung: "Keine Einschränkung — universell gültig, AIHTA-Studie bestätigt für AT"
      - insight: "Bildung + Rewards ist stärkste Kombination (nur 20% der Apps)"
        einschraenkung: "Keine Einschränkung — österreichische Bildungsaffinität sogar höher als in angelsächsischen Märkten"
      - insight: "DSGVO-Compliance als Vertrauensmerkmal (Pandocs)"
        einschraenkung: "In Österreich NOCH wichtiger als in anderen EU-Ländern (aktive DSB, 5.300 Beschwerden 2025)"

    eingeschraenkt_uebertragbar:
      - insight: "WeWards virales Community-Wachstum (+150% in 9 Monaten)"
        einschraenkung: >
          Virales Social-Sharing ist in Österreich durch Datenschutzsensibilität gebremst.
          Opt-in-Mechanismen und Privacy-by-Default sind Pflicht. Wachstum wird langsamer sein.
      - insight: "Sweatcoins 'earn money' Messaging"
        einschraenkung: >
          Österreichischer Skeptizismus macht dieses Messaging kontraproduktiv.
          Framing umstellen: Belohnungen bei lokalen Partnern, nicht Geldverdienen.
      - insight: "Pacelineals B2G-Insurance-Modell ($54.9M)"
        einschraenkung: >
          US-privates Krankenversicherungsmodell nicht übertragbar. Österreichisches Äquivalent:
          SVS-Gesundheitshunderter und GKK-BGF-Programme. Andere Mechanik, ähnliches Ziel.

    nicht_uebertragbar:
      - insight: "Sweatcoin SWEAT-Token / Krypto-Mechanismus"
        begruendung: "Österreichische Nutzer sind krypto-skeptisch; regulatorische Unsicherheit; kein kultureller Fit"
      - insight: "WeWards globale Wachstumsstrategie (25M Downloads in 20+ Ländern gleichzeitig)"
        begruendung: "AustroFit ist bewusst lokal verankert — regionale Partner sind der USP, nicht globale Skalierung"

