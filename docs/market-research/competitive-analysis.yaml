    - { name: Charity Miles, typ: "Schritte → Spenden für wohltätige Zwecke", herkunft: USA,  notiz: "CSR-Winkel; kein B2C-Reward" }
    - { name: StepBet,       typ: "Step-Betting mit Geld-Einsatz",          herkunft: USA,    notiz: "Wie Cadoo – GSpG-Risiko" }
    - { name: Carrot,        typ: "Abnehm-App mit Rewards",                  herkunft: USA,    notiz: "Fokus auf Gewichtsabnahme, nicht Prävention" }
    - { name: DietBet,       typ: "Diät-Wetten mit Geld-Einsatz",           herkunft: USA,    notiz: "GSpG-Risiko + Fokus Abnehmen" }
    - { name: Lifecoin,      typ: "Schritte → Kryptowährung",               herkunft: Global, notiz: "Crypto-Modell; regulatorisch komplex in AT" }
    - { name: Cashwalk,      typ: "Schritte → Gutscheine (Korea)",          herkunft: Korea,  notiz: "Nur asiatischer Markt" }
    - { name: Virgin Pulse,  typ: "B2B Enterprise Wellness",                herkunft: USA,    notiz: "Nur Enterprise (>1000 MA); kein B2C" }
    - { name: winwalk,       typ: "Schritte → Gutscheine (Korea)",          herkunft: Korea,  notiz: "Nur asiatischer Markt" }
    - { name: WayBetter,     typ: "Habit-Betting mit Geld-Einsatz",         herkunft: USA,    notiz: "GSpG-Modell; Habit-Tracking interessant" }
    - { name: "Generali Vitality", typ: "Bereits unter oesterreichische_apps" }
    - { name: "Wien zu Fuß",       typ: "Bereits unter oesterreichische_apps" }
    - { name: "Mavie Move",        typ: "Bereits unter oesterreichische_apps" }

