# ──────────────────────────────────────────────
# BREAK-EVEN
# ──────────────────────────────────────────────
break_even:
  monat: 42
  jahr: 4
  nutzer: 1010
  partner: 51
  milestone_ref: break-even
  worst_case:
    monat: 55
    nutzer: 1686
    partner: 122
    beschreibung: "+30% Monate, +67% Nutzer, +200% Partner bei +20% Kosten/-20% Umsatz"

# ──────────────────────────────────────────────
# KAPITALBEDARF & FINANZIERUNGSSTRATEGIE
# ──────────────────────────────────────────────
kapitalbedarf:
  gesamt_eur: 16000
  beschreibung: >
    Exklusive Deferred Salary. Inkludiert konservativen Puffer (~20%)
    auf kumulierte Verluste der ersten zwei Jahre (~13.200€).
  worst_case_eur: 28500
  worst_case_beschreibung: >
    +80% bei Worst-Case-Szenario (+20% Kosten/-20% Umsatz),
    bezogen auf kumulierte Verluste der ersten drei Jahre (~23.700€).

  finanzierungsquellen:
    - quelle: "Eigenmittel Gründer"
      betrag_eur: 5000
      status: "vorhanden"
      notes: "Für MVP-Start ausreichend"
    - quelle: "NeuFöG + SVS Gründerbegünstigung"
      betrag_eur: 1450
      status: "geplant"
      foerder_ref: [neufoeg, svs-gruenderbeguenstigung]
    - quelle: "aws First Incubator + FFG Projekt.Start"
      betrag_eur: 10000    # konservative Schätzung (60% von 10.000+)
      status: "geplant"
      foerder_ref: [aws-first-incubator, ffg-projekt-start]
    - quelle: "Anschlussfinanzierung (B2G / Impact-Investor)"
      betrag_eur: null
      status: "optional Phase 3+"
      notes: "Nur wenn organisches Wachstum nicht ausreicht"

# ──────────────────────────────────────────────
# LIQUIDITÄTS-AMPELSYSTEM
# ──────────────────────────────────────────────
liquiditaet:
  monitor: "Rolling-12-Cash-Forecast, monatlich"
  ampel:
    - farbe: gruen
      trigger_cash_puffer_monate: 6
      trigger_eur_gt: 3600
      massnahmen:
        - "Kampagnen bei ROAS ≥ 3 weiterlaufen"
        - "MVP-Backlog abarbeiten"
        - "Weekly KPI-Check"
    - farbe: gelb
      trigger_cash_puffer_monate: "3–6"
      trigger_eur_range: [1800, 3600]
      massnahmen:
        - "Paid-Ads -30%, Fokus SEO-Blog + Referral"
        - "Zwei KMU-Pilotpartner kostenlos listen"
        - "Förderanträge einreichen"
        - "Gamification-Features auf Post-MVP verschieben"
    - farbe: orange
      trigger_cash_puffer_monate: "1,5–3"
      trigger_eur_range: [900, 1800]
      massnahmen:
        - "Freelance-Freeze"
        - "Nur Retargeting-Ads < 50€/Monat"
        - "Hosting-Tiers downgraden"
        - "Gründerlohn = 0€"
        - "Bridge-Note 10.000–15.000€ vorbereiten"
    - farbe: rot
      trigger_cash_puffer_monate_lt: 1.5
      trigger_eur_lt: 900
      massnahmen:
        - "B2B-Partnerpakete Jahr 2 mit 20% Rabatt prepaid verkaufen"
        - "Crowdfunding (Health-Goodie-Box + In-App Badge)"
        - "Punkte-Einlösungen nur bei Partners mit ≥50% Gutscheinwert"
        - "Convertible SAFE ~50.000€ sichern"
