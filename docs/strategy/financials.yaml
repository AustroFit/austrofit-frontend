# AustroFit Finanzplan
# Preismodell, Kostenstruktur, Umsatzprognosen, Kapitalbedarf.
# Ablage: docs/strategy/financials.yaml
# Erstellt: 2026-05-28
# Quelle: Business Plan v0.13, Kap. 5.3, 6.1–6.5
#
# Designprinzip — Single Source of Truth:
#   Zahlen und Annahmen leben hier. Prognosen referenzieren Meilensteine
#   via milestone_ref → docs/strategy/milestones.yaml (id).
#   Narrative (Begründungen, Herleitung) bleibt in business-plan.yaml.
#   Wenn sich Annahmen ändern: hier updaten, version bumpen, changelog ergänzen.

meta:
  titel: AustroFit Finanzplan
  version: "1.0"
  erstellt: "2026-05-28"
  aktualisiert: "2026-05-28"
  quelle_original: "Business Plan v0.13, Kap. 5.3 + 6.1–6.5"
  beschreibung: >
    Maschinenlesbarer Finanzplan. Enthält ausschließlich Zahlen und Annahmen.
    Zum Businessplan-Narrative: /businessplan generiert daraus den Fließtext.
  aenderungslog:
    - version: "1.0"
      datum: "2026-05-28"
      aenderungen:
        - "Initiale Extraktion aus Business Plan v0.13 (Kap. 5.3, 6.1-6.5)"
        - "Hosting-Kosten aktualisiert: Supabase → Vercel + Directus Cloud (Stand März 2026)"

# ──────────────────────────────────────────────
# ERLÖSMODELL (B2B)
# ──────────────────────────────────────────────
erloesmodell:
  b2c_kostenlos: true   # unveränderlich — Kernprinzip Social Business

  provision:
    beschreibung: "Pay-per-Redemption: Provision auf Partner-Bruttoumsatz via AustroFit"
    staffel:
      - bis_eur: 5000
        provision_pct: 6
      - bis_eur: 25000
        provision_pct: 5
      - ab_eur: 25001
        provision_pct: 4
    gemischter_satz_annahme_pct: 5   # für ARPU-Berechnungen

  partnerpakete:
    - id: basic
      preis_eur_monat: 0
      leistungen: "Gutschein-Einlösung, Zugang zum Dashboard"
    - id: plus
      preis_eur_monat: 19
      leistungen: "Priorisierte Darstellung, Highlight-Badge, 50 Gratis-Listings"
    - id: premium
      preis_eur_monat: 39
      leistungen: "Event-Integration, Statistikauswertungen, Logo-Branding, 200 Gratis-Listings"
    - id: nachhaltigkeit
      preis_eur_monat: 29
      leistungen: "ESG-Label, Filterplatzierung, 300 Gratis-Listings"
      voraussetzung: "Zertifizierter Nachhaltigkeitsnachweis"

  listing_gebuehren:
    gebuehr_pro_angebot_eur: 0.20    # Durchschnitt (Großunternehmen 0,25€, KMU 0€)
    erneuerung_tage: 90
    annahme_listings_pro_partner: 25
    annahme_zahlende_partner_pct: 60

  paket_verteilung_annahmen:
    basic_pct: 40    # testen, Kleinstbudget
    plus_pct: 35     # mehr Sichtbarkeit
    premium_pct: 15  # Ketten, größere Unternehmen
    nachhaltigkeit_pct: 10

  wert_austausch:
    punkte_pro_eur: 100   # 100 Punkte ≙ 1 € Einlösewert (kommuniziert)

# ──────────────────────────────────────────────
# ARPU-MODELL
# ──────────────────────────────────────────────
arpu:
  gesundheits_portemonnaie_eur_monat: 273   # Ø monatliche Gesundheitsausgaben B2C-Zielgruppe
  provision_satz_pct: 5
  formel: "gesundheits_portemonnaie × capture_rate × provision × 12"
  szenarien:
    - capture_rate_pct: 1
      arpu_eur_jahr: 1.60
      beschreibung: "Sehr konservativ – Proof of Concept, wenige Partner"
    - capture_rate_pct: 3
      arpu_eur_jahr: 4.90
      beschreibung: "Realistisch – nach 24 Monaten mit gutem Partnermix"
    - capture_rate_pct: 5
      arpu_eur_jahr: 8.20
      beschreibung: "Ambitioniert – starkes Loyalty-Programm"
    - capture_rate_pct: 10
      arpu_eur_jahr: 16.40
      beschreibung: "Sehr ambitioniert – starke Partnerdeals, breites Akzeptanznetz"

# ──────────────────────────────────────────────
