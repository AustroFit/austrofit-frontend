# ──────────────────────────────────────────────
# KOSTENPLANUNG
# ──────────────────────────────────────────────
kosten:
  einmalig_investitionen:
    gesamt_eur: 5000
    positionen:
      - bezeichnung: "Web-App-Entwicklung (MVP)"
        betrag_eur: 50
        notes: "KI-Tools + Netzwerk; Großteil Eigenleistung"
      - bezeichnung: "Hosting, Software-Tools (Jahr 1)"
        betrag_eur: 500
        notes: "Domain, Directus Cloud, Vercel Pro, App Store Accounts"
      - bezeichnung: "Recht & Datenschutz (AGB, DSGVO-Beratung)"
        betrag_eur: 1000
        notes: "WKO Erstberatung + externer Anwalt für AGB + DPIA"
      - bezeichnung: "Markenanmeldung AustroFit (ÖPA)"
        betrag_eur: 1250
        notes: "Einmalige Gebühr, REQ-B-003"
      - bezeichnung: "Reserve & Unvorhergesehenes"
        betrag_eur: 2000
        notes: "ca. 20% Puffer auf Gesamtkosten"

  laufend_monatlich:
    gesamt_ohne_puffer_eur: 600
    positionen:
      - bezeichnung: "App-Hosting (Vercel Pro + Directus Cloud)"
        betrag_eur: 45
        notes: "Stand Mai 2026: Vercel Pro ~20€ + Directus Cloud ~25€; Vercel Hobby blockiert AVV"
      - bezeichnung: "App Store (Apple Developer Account)"
        betrag_eur: 8
        notes: "Apple 99 USD/Jahr ≈ 8€/Monat; Google Play einmalig 25 USD"
      - bezeichnung: "Schnittstellen & APIs"
        betrag_eur: 0
        notes: "Health Connect, HealthKit: kostenlos"
      - bezeichnung: "Marketingkosten (CAC)"
        betrag_eur: 200
        notes: "Jahr 1; steigt proportional mit Nutzerwachstum. Ziel ROAS ≥ 3."
      - bezeichnung: "Buchhaltung & Steuerberatung"
        betrag_eur: 100
        notes: "Je nach Abrechnungstaktung"
      - bezeichnung: "Versicherungen & gewerbliche Abgaben"
        betrag_eur: 200
        notes: "Unfall, Haftpflicht, Cyber, Grundumlagen"
      - bezeichnung: "App-Wartung & Support"
        betrag_eur: 0
        notes: "Aktuell intern; kein externer Aufwand"

  deferred_salary:
    betrag_eur_monat: 600
    auszahlung_ab_mrr_eur: 15000
    beschreibung: >
      Gründerlohn als kalkulatorische Größe (Deferred Salary).
      Keine Entnahmen bis ≥ 15.000 € Monthly Recurring Revenue.
      Wird für Kostenrechnung mit 600 €/Monat berücksichtigt.

