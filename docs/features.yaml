  - id: security-headers
    name: "Security Headers (CSP, X-Content-Type-Options, X-Frame-Options, …)"
    status: implemented
    category: sicherheit
    phase: mvp
    description: >
      vercel.json setzt für alle Routen:
      Content-Security-Policy (default-src 'self', script-src 'unsafe-inline' + PostHog,
      object-src 'none', frame-ancestors 'none', base-uri 'self'),
      X-Content-Type-Options: nosniff,
      X-Frame-Options: DENY,
      Referrer-Policy: strict-origin-when-cross-origin,
      Permissions-Policy: camera=(), microphone=(), geolocation=().
    notes: >
      CSP nutzt 'unsafe-inline' für script-src (SvelteKit Hydration unvermeidbar).
      Schränkt Fremd-Script-Injection und Clickjacking ein; reduziert XSS-Risiko
      beim localStorage-JWT. Gilt nur für Vercel-Deployment; lokal nicht aktiv.
    linked_files:
