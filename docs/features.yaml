# AustroFit Feature Registry
# Maschinenlesbare Übersicht aller Features – implementiert, geplant, verworfen, TBD
# Ablage: docs/features.yaml
# Erstellt: 2026-05-16
# Quellen: Directus-JSON-AustroFit/austrofit-business-plan.yaml,
#          Directus-JSON-AustroFit/service-blueprint.html, CLAUDE.md (Ist-Stand Codebasis)

meta:
  titel: AustroFit Feature Registry
  version: "1.3"
  erstellt: "2026-05-16"
  aktualisiert: "2026-05-24"
  beschreibung: >
    Feature-Liste für Entwicklung, Planung und regulatorische Checks.
    Kombiniert Ist-Stand (Codebasis) mit Roadmap (Business Plan v1.3, Service Blueprint v1.1).
    Regulatorische Anforderungen → docs/compliance.yaml
  status_werte:
    implemented: "Im Code vorhanden und produktiv aktiv"
    in-progress: "In Entwicklung oder teilweise implementiert"
    planned:     "Konkret in Roadmap eingeplant"
    to-discuss:  "Idee oder Anforderung vorhanden, Umsetzung offen"
    rejected:    "Bewusst verworfen – Begründung in notes"
  phase_werte:
    mvp:       "MVP / aktueller Stand"
    phase-2:   "Phase 2 (nach erstem Launch, ~Jahr 1–3)"
    phase-3+:  "Langfristig (Jahr 3+, B2G-Fokus)"

categories:
  gamification: "Punkte, Level, Streaks, Badges, Milestones, Challenges"
  aktivitaet:   "Bewegungstracking via Health APIs"
  bildung:      "Artikel, Quiz, Lernmodule"
  belohnung:    "Marketplace, Partner, Gutscheine, Einlösung"
  community:    "Leaderboard, Events, Referral, Social"
  auth:         "Login, Registrierung, Profil, DSGVO"
  sicherheit:   "Fraud Detection, Input-Validierung, Sicherheits-Hardening"
  plattform:    "PWA, Capacitor, Service Worker, Push"
  b2b:          "Partnerpakete, B2B-Dashboard, Abrechnung"
  b2g:          "Kooperationen mit öffentlichen Gesundheitsakteuren"
  analytics:    "Tracking, Events, Reporting"
  praevention:  "Nachweis-basierte Präventionsmaßnahmen"

features:

  # ─────────────────────────────────────────────────────────────────
  # GAMIFICATION
  # ─────────────────────────────────────────────────────────────────

  - id: punkte-ledger
    name: "Punkte-Ledger (append-only)"
    status: implemented
    category: gamification
    phase: mvp
    description: >
      Append-only Buchungssystem in points_ledger. Kontostand = SUM(points_delta).
      Jede Buchung enthält source_type, source_ref, rule_version, occurred_at.
    notes: >
      source_ref ist Typ string → Directus lehnt _gte/_lte ab (400-Fehler).
      Datumsbereiche immer via _in mit expliziter Liste.
      Zwei simultane _in-Filter auf verschiedenen Feldern → leere Response.
      occurred_at = Sync-Zeitpunkt (nicht Aktivitätsdatum) bei retroaktiven Syncs.
    linked_files:
      - src/lib/server/stepsService.ts
      - src/lib/server/cardioService.ts
      - src/lib/server/streak.ts
      - src/routes/api/claim/+server.ts
    related_features:
      - level-system
      - streak-schritte
      - streak-cardio
      - streak-quiz
      - milestones

  - id: level-system
    name: "Level-System (20 Stufen)"
    status: implemented
    category: gamification
    phase: mvp
    description: >
      20 Level basierend auf earnedPoints (positive_only=true, SUM).
      Einlösungen reduzieren das Level nicht. AustroFit-Branding alle 5 Level.
      Bereich 0–480.000P. Berechnung client-seitig via getLevelInfo().
    linked_files:
      - src/lib/utils/level.ts
      - src/routes/api/ledger-total/+server.ts
    related_features:
      - punkte-ledger

  - id: streak-schritte
    name: "Schritt-Streak (täglich, tiered)"
    status: implemented
    category: gamification
    phase: mvp
    description: >
      Tages-Streak-Bonus bei ≥7.000 Schritten.
      Tier 1 (2–13d) +20P / Tier 2 (14–27d) +30P / Tier 3 (28–55d) +45P / Tier 4 (56+d) +60P.
      source_type='streak_tag'.
    linked_files:
      - src/lib/server/streak.ts
    related_features:
      - streak-wochen-bonus
      - milestones
      - schritte-android

  - id: streak-wochen-bonus
    name: "Streak-Wochen-Bonus (Schritte, tiered)"
    status: implemented
    category: gamification
    phase: mvp
    description: >
      Feuert wenn (streak_days - 1) % 7 === 0.
      Tier 1 +60P / Tier 2 +90P / Tier 3 +120P / Tier 4 +150P.
      source_type='streak'. Dedup-Check vor Schreiben.
    notes: >
      Dedup-Check wurde Mai 2026 als Sicherheits-Fix ergänzt.
      Verhindert Doppelbuchung bei parallelen API-Calls. Nicht rückgängig machen.
    linked_files:
      - src/lib/server/streak.ts
    related_features:
      - streak-schritte
      - streak-wochen-bonus-dedup

  - id: streak-cardio
    name: "Cardio-Streak (wöchentlich, tiered)"
    status: implemented
    category: gamification
    phase: mvp
    description: >
      Bonus ab der zweiten aufeinanderfolgenden Woche mit vollem Cardio-Ziel.
      W2–3 +100P / W4–7 +200P / W8–11 +300P / W12+ +400P.
      source_type='streak', source_ref='cardio-streak-{weekKey}'.
    linked_files:
      - src/lib/server/cardioService.ts
      - src/lib/server/streak.ts
    related_features:
      - cardio-android
      - milestones

  - id: streak-quiz
    name: "Quiz-Streak (täglich + wöchentlich, tiered)"
    status: implemented
    category: gamification
    phase: mvp
    description: >
      Tages-Bonus ab Tag 2: T1(2–6d)+5P / T2(7–13d)+10P / T3(14–29d)+15P / T4(30+d)+20P.
      source_type='streak_quiz'.
      Wochen-Meilenstein: T1+30P / T2+50P / T3+75P / T4+100P.
      source_type='streak'.
    linked_files:
      - src/lib/server/streak.ts
      - src/routes/api/claim/+server.ts
    related_features:
      - quiz-authentifiziert
      - milestones

  - id: milestones
    name: "Milestones (22 einmalige Boni)"
    status: implemented
    category: gamification
    phase: mvp
    description: >
      22 einmalige Boni für erste Achievements.
      source_type='milestone', source_ref='milestone-{slug}'.
      Kategorien: Schritte (7), Cardio (4), Quiz (7). Dedup via source_ref.
    linked_files:
      - src/lib/utils/milestones.ts
      - src/lib/server/milestoneService.ts
    related_features:
      - streak-schritte
      - streak-cardio
      - streak-quiz

  - id: badges
    name: "Badges (113 Directus-Badges)"
    status: implemented
    category: gamification
    phase: mvp
    description: >
      113 Badges in Directus Collection 'Badges'. Earned-Flag: total_steps >= step_threshold.
      Typen: hauptstadt, bundesland, oesterreich, wanderweg, see, berg.
      Bilder noch nicht hochgeladen → Emoji-Platzhalter.
    notes: >
      Lesezugriff nur via DIRECTUS_READ_TOKEN (nicht PRIVATE_CMS_STATIC_TOKEN).
      Badge-Bilder sind Phase 2.
    linked_files:
      - src/routes/api/badges/+server.ts
      - src/lib/utils/badges.ts
    related_features:
      - punkte-ledger

  - id: cardio-badges
    name: "Cardio-Achievements / Badges"
    status: planned
    category: gamification
    phase: phase-2
    description: >
      Badges und einmalige Boni für Cardio-Achievements (erstes Workout, erste
      volle Cardio-Woche, 4/8/12 aufeinanderfolgende Wochen usw.).
      Ergänzt die bestehenden step_threshold-Badges, die nur auf total_steps basieren.
      Daten liegen im Ledger vor (source_type='streak', source_ref='cardio-YYYY-Wnn') —
      kein neues Datenbankfeld erforderlich.
    related_features:
      - badges
      - cardio-android
      - milestones

  - id: challenges
    name: "Challenges"
    status: in-progress
    category: gamification
    phase: mvp
    description: >
      Directus Collection 'challenges' (id, titel, beschreibung, punkte_wert, aktiv_bis, status)
      und API-Route /api/challenges vorhanden. Dashboard-Integration teilweise implementiert.
    notes: >
      Schema-Erweiterung Mai 2026 (Option B): Felder aktiv_von (DateTime), completion_type
      (Dropdown: steps_total/steps_today/quiz_streak/cardio_week/manual), target_value (Integer)
      in Directus angelegt. Dedup via points_ledger (source_type='challenge',
      source_ref='challenge-{id}'). Completion-Logik und Claim-Button noch nicht implementiert.
    linked_files:
      - src/routes/api/challenges/+server.ts
    related_features:
      - punkte-ledger

  - id: gewinnspiele
    name: "Gewinnspiele / Lotteries"
    status: planned
    category: gamification
    phase: phase-2
    description: >
      Regelmäßige Gewinnspiele für aktive Nutzer. Im Octalysis-Framework als
      Engagement-Element (Core Drive 4) vorgesehen.
    related_features:
      - community-events

  - id: schritt-formel-gleitend
    name: "Gleitende Schritt-Skala 4001–6999"
    status: planned
    category: gamification
    phase: phase-2
    description: >
      Aktuell MVP-Vereinfachung: alle Schritte 4000–6999 erhalten flat 10P.
      Geplant: 10P + floor((schritte-4000)/500)*5P.
      Formelquelle: Business Plan Anhang A1. Änderungen nie retroaktiv.
    linked_files:
      - src/lib/server/stepsService.ts
    related_features:
      - schritte-android
      - punkte-ledger

  - id: onboarding-booster
    name: "Onboarding-Booster (1,5× Multiplikator)"
    status: rejected
    category: gamification
    phase: mvp
    description: "1,5× Punktemultiplikator für neue Nutzer. Bewusst entfernt."
    notes: >
      onboarding_booster_until existiert noch als Directus-Feld, wird nicht mehr
      gesetzt oder gelesen. Kein source_type='onboarding' mehr.
    related_features:
      - punkte-ledger

  - id: streak-freeze
    name: "Streak-Freeze / Streak-Repair"
    status: to-discuss
    category: gamification
    phase: phase-2
    description: >
      Verhindern des Streak-Verlusts bei einem verpassten Tag (Octalysis Core Drive 8:
      Loss Avoidance). Mögliche Mechaniken: einmalige Freeze-Items als Marketplace-
      Belohnung (z.B. 200P = 1 Streak Freeze) oder automatischer Schutz nach
      Erreichen bestimmter Streak-Längen.
    notes: >
      Verhältnis zum Streak-System klären: Wie wird ein gefrorener Tag in der
      Streak-Berechnung behandelt? Setzt der Streak-Counter weiter?
      Auswirkung auf Wochen-Meilensteine?
    related_features:
      - streak-schritte
      - streak-wochen-bonus
      - direktpartner-redeem

  - id: personal-records
    name: "Personal Records (Bestleistungen)"
    status: to-discuss
    category: gamification
    phase: phase-2
    description: >
      Anzeige persönlicher Bestleistungen: bisher stärkster Schritt-Tag,
      längste Schritt-Streak, längste Cardio-Streak, höchste Wochen-Schrittanzahl.
      Alle Daten liegen im points_ledger und user_profiles.totalSteps vor —
      kein neues Datenbankfeld erforderlich.
    related_features:
      - punkte-ledger
      - streak-schritte
      - streak-cardio

  # ─────────────────────────────────────────────────────────────────
  # AKTIVITÄT
  # ─────────────────────────────────────────────────────────────────

  - id: schritte-android
    name: "Schritt-Tracking Android (Health Connect)"
    status: implemented
    category: aktivitaet
    phase: mvp
    description: >
      Tagesschritte via @capgo/capacitor-health v8.2.17 (Health Connect).
      Dedup via source_ref=YYYY-MM-DD. syncSteps() mit Concurrency-Guard (_syncing-Flag).
      Retroaktiv: letzte 90 Tage.
    notes: >
      occurred_at = Sync-Zeitpunkt, nicht Aktivitätsdatum.
      Monatsansicht filtert client-seitig via source_ref (kein occurred_at-Filter).
      Concurrency-Guard (_syncing) nicht entfernen → verhindert Doppelbuchungen.
    linked_files:
      - src/lib/services/health.ts
      - src/lib/services/stepSync.ts
      - src/lib/server/stepsService.ts
      - src/routes/api/steps/sync/+server.ts
    related_features:
      - streak-schritte
      - background-sync
      - steps-fraud-cap
      - ios-healthkit

  - id: cardio-android
    name: "Cardio-Tracking Android (Health Connect)"
    status: implemented
    category: aktivitaet
    phase: mvp
    description: >
      Workouts via @capgo/capacitor-health. Intensitätsmapping (moderat×1, intensiv×2).
      Gruppenspezifische Wochenziele (adult/senior/pregnant: start=50/full=150min;
      chronic: start=35/full=100min). Dedup via start_date (Option C: PATCH bei mehr Aktivität).
      Retroaktiv: letzte 9 Tage. Ergebnisse in activity_logs Collection.
    notes: >
      Pregnant: intensive Workout-Typen (running, cycling) werden als moderat (1×) gewertet.
      durationSeconds gecappt auf 4h in getEquivalentMinutes() (Security-Fix Mai 2026).
      source_ref='cardio-YYYY-Wnn'. Cardio-History filtert via source_ref[_in] (ISO-Wochen).
    linked_files:
      - src/lib/services/health.ts
      - src/lib/services/cardioSync.ts
      - src/lib/server/cardioService.ts
      - src/routes/api/cardio/sync/+server.ts
    related_features:
      - streak-cardio
      - cardio-duration-cap
      - cardio-input-limits
      - ios-healthkit

  - id: ios-healthkit
    name: "iOS Tracking (HealthKit)"
    status: planned
    category: aktivitaet
    phase: phase-2
    description: >
      Schritte und Workouts via Apple HealthKit. isNative() Guards im Code vorhanden.
      iOS-App (TestFlight) noch nicht gebaut.
    linked_files:
      - src/lib/services/health.ts
    related_features:
      - schritte-android
      - cardio-android
      - ios-app

  - id: cardio-typen-erweitert
    name: "Erweiterte Cardio-Typen (Ski, Snowboard, Tanzen)"
    status: planned
    category: aktivitaet
    phase: phase-2
    description: >
      Ski, Snowboard, Tanzen nicht im MVP – Plugin-Limitation (@capgo/capacitor-health
      hat diese Typen nicht in HealthDataType typedef).
    notes: "Für Phase 2 vorgesehen sobald Plugin-Support vorhanden."
    related_features:
      - cardio-android

  - id: background-sync
    name: "Background Sync (Schritte)"
    status: implemented
    category: aktivitaet
    phase: mvp
    description: >
      Periodic Background Sync via Service Worker (Tag: 'austrofit-step-sync', täglich auf Android Chrome).
      Setzt pending_sync-Flag in IndexedDB. Dashboard liest Flag in onMount und triggert syncSteps().
    notes: >
      Capacitor-Aufruf aus Service Worker nicht möglich → Flag-Pattern als Workaround.
    linked_files:
      - src/service-worker.ts
      - src/lib/services/stepSync.ts
    related_features:
      - schritte-android
      - pwa-service-worker

  # ─────────────────────────────────────────────────────────────────
  # BILDUNG
  # ─────────────────────────────────────────────────────────────────

  - id: gesundheitswegweiser-artikel
    name: "Gesundheitswegweiser (Artikel)"
    status: implemented
    category: bildung
    phase: mvp
    description: >
      SEO-optimierte Artikel im Directus CMS (Collection: articles).
      Erreichbar via /artikel/[slug] und /gesundheitswegweiser/[slug].
      Primärer Akquisitionskanal: Nutzer liest Artikel, absolviert Quiz (unregistriert)
      → Conversion-Trigger zur Registrierung.
    linked_files:
      - src/routes/artikel/[slug]/+page.svelte
    related_features:
      - quiz-anonym

  - id: quiz-anonym
    name: "Quiz (anonym, ohne Login)"
    status: implemented
    category: bildung
    phase: mvp
    description: >
      Quiz absolvierbar ohne Registrierung. anonymous_id via localStorage.
      Punkte werden simuliert/angezeigt aber nicht gebucht.
      Claim-Flow nach Login verfügbar.
    linked_files:
      - src/lib/components/singlepage/Quiz.svelte
      - src/routes/api/quiz-attempts/+server.ts
    related_features:
      - quiz-authentifiziert
      - quiz-cooldown
      - quiz-claim-flow

  - id: quiz-authentifiziert
    name: "Quiz (authentifiziert, mit Punktevergabe)"
    status: implemented
    category: bildung
    phase: mvp
    description: >
      Punkte nach Login via /api/claim. eligible_points gecappt auf max. 200P.
      max_score wird gegen Directus quiz_json.questions.length validiert (fail-closed).
      250 Quizze im Pool.
    notes: >
      Sicherheits-Hardening Mai 2026: Allowlist-Payload, server-seitige passed-Ableitung,
      quiz_json-Validierung. Details unter quiz-allowlist-payload.
    linked_files:
      - src/lib/components/singlepage/Quiz.svelte
      - src/routes/api/quiz-attempts/+server.ts
      - src/routes/api/claim/+server.ts
    related_features:
      - quiz-anonym
      - quiz-cooldown
      - quiz-claim-flow
      - quiz-allowlist-payload

  - id: quiz-claim-flow
    name: "Quiz Claim-Flow (anonym → authentifiziert)"
    status: implemented
    category: bildung
    phase: mvp
    description: >
      Nach Login werden ausstehende anonyme Quiz-Versuche dem User zugeordnet
      und Punkte vergeben. PENDING_CLAIM_KEY in localStorage.
      JWT kommt aus Authorization-Header (nicht Body).
    notes: >
      Token-Migration Mai 2026: Token aus Bearer-Header (war vorher: Request-Body).
      Client setzt Authorization: Bearer <token>. Nicht rückgängig machen.
    linked_files:
      - src/routes/api/claim/+server.ts
      - src/lib/components/singlepage/Quiz.svelte
    related_features:
      - quiz-anonym
      - claim-bearer-token

  - id: quiz-cooldown
    name: "Quiz-Cooldown (30 Tage)"
    status: implemented
    category: bildung
    phase: mvp
    description: >
      Pro User+Quiz 30-Tage-Cooldown (konfigurierbar in Directus cooldown_days-Feld).
      Doppelt geprüft: bei /api/quiz-attempts (anonym) UND /api/claim (per User).
    notes: >
      Per-User-Cooldown bei /api/claim ist Security-Fix Mai 2026.
      Verhindert Bypass durch Anlegen neuer anonymous_ids. Nicht rückgängig machen.
    linked_files:
      - src/routes/api/quiz-attempts/+server.ts
      - src/routes/api/claim/+server.ts
    related_features:
      - quiz-anonym
      - quiz-authentifiziert
      - claim-cooldown-server

  - id: refresh-quiz
    name: "Refresh-Quiz (nach 90 Tagen erneut +40P)"
    status: to-discuss
    category: bildung
    phase: phase-2
    description: >
      Im Business Plan (Anhang A1) vorgesehen: Nach 90 Tagen kann dasselbe Quiz erneut
      absolviert werden und gibt wieder Punkte. Festigt Wissen und liefert denselben Reward.
    notes: >
      Noch nicht implementiert. Verhältnis zu aktuellem 30-Tage-Cooldown muss geklärt werden:
      Ist der Cooldown ein Schutz vor Spam (→ bleibt) und der Refresh ein separater
      Mechanismus nach längerer Zeit? Oder ersetzen sich beide?
    related_features:
      - quiz-cooldown

  # ─────────────────────────────────────────────────────────────────
  # BELOHNUNG
  # ─────────────────────────────────────────────────────────────────

  - id: direktpartner-marketplace
    name: "Direktpartner-Marketplace"
    status: implemented
    category: belohnung
    phase: mvp
    description: >
      Marketplace für Direktpartner-Gutscheine unter /belohnung.
      Tabs: Offen (AWIN-Platzhalter), Aktiv (eingelöste Gutscheine), Archiv.
      Noch keine echten Partner-Verträge vorhanden.
    notes: "Technisch vollständig. Geschäftlich: Keine echten Partner, kein B2B-Onboarding."
    linked_files:
      - src/routes/belohnung/+page.svelte
      - src/routes/api/partner/+server.ts
    related_features:
      - direktpartner-redeem
      - partner-filter
      - awin-integration

  - id: direktpartner-redeem
    name: "Direktpartner-Einlösung (Redeem-Flow)"
    status: implemented
    category: belohnung
    phase: mvp
    description: >
      /api/redeem erstellt reward_redemptions-Eintrag + negative Ledger-Buchung.
      Dedup-Check vor Einlösung (409 bei bereits vorhandener active/used-Einlösung).
      Aktive Gutscheine im Tab 'Aktiv' unter /belohnung.
    notes: "Dedup-Check ist Security-Fix Mai 2026 – verhindert Double-Spend via parallele Requests."
    linked_files:
      - src/routes/api/redeem/+server.ts
      - src/routes/api/gutscheine/+server.ts
    related_features:
      - direktpartner-marketplace
      - redeem-dedup
      - punkte-ledger

  - id: partner-filter
    name: "Partner-Filter (Kategorie, Region, ESG)"
    status: implemented
    category: belohnung
    phase: mvp
    description: >
      Client-side Filter für Partnerangebote. 9 Kategorie-Slugs
      (fitnessstudio, sportgeraete, sportbekleidung, privat-sport, wellness,
      apotheke, nahrungsergaenzung, bio-lebensmittel, pflegeprodukte),
      Region-Dropdown, ESG-Toggle. Filterung via $derived ohne Re-Fetch.
    linked_files:
      - src/routes/belohnung/+page.svelte
    related_features:
      - direktpartner-marketplace

  - id: awin-integration
    name: "AWIN/TradeDoubler Affiliate-Integration"
    status: implemented
    category: belohnung
    phase: mvp
    description: >
      AWIN Publisher-Account (ID: 1896704) und TradeDoubler-Account (Publisher 2466954)
      aktiv. Gutscheincodes via CSV-Export vorhanden (Mai 2026):
      14 AWIN-Codes (Plankpad, Sportstech AT, apotheke.at, 100percentpure, Wellness Point),
      3 TradeDoubler-Rabatte ohne Code (Qathu AT, Papique AT, OneBioShop AT).
      Directus rewards-Collection erweitert: reward_type (direktpartner|awin|tradedoubler),
      affiliate_tracking_url (String). Punkte-Modell: 100P pro 1% Rabatt (z.B. 500P=5%,
      2000P=20%), Festbeträge analog (500P=5€, 600P=6€ usw.).
    notes: >
      Implementiert Mai 2026. Promotions werden in Directus Collection 'online_promotions'
      gepflegt (nicht in 'rewards'). 12 aktive Angebote (AWIN). Freischaltung via
      /api/awin/unlock-code, Punkte-Abzug via points_ledger (source_type='awin_unlock').
      Policy-Gotcha: online_promotions braucht Read in 'Write Content API' (PRIVATE_CMS_STATIC_TOKEN)
      UND 'Read Content API' (DIRECTUS_READ_TOKEN).
      TradeDoubler-Angebote noch nicht eingetragen (kein Code, nur Tracking-URL – vorerst nicht vorgesehen).
    linked_files:
      - docs/2026-05-16-awin-promotions.csv
      - docs/2026-05-16-tradedoubler-vouchers.csv
    related_features:
      - direktpartner-marketplace
      - direktpartner-redeem

  # ─────────────────────────────────────────────────────────────────
  # COMMUNITY
  # ─────────────────────────────────────────────────────────────────

  - id: leaderboard
    name: "Leaderboard / Bestenliste"
    status: planned
    category: community
    phase: phase-2
    description: >
      Rangliste aktiver Nutzer nach Punkten oder Aktivität. Service Blueprint Phase 2.
      Cold-Start-Regel: Erst umsetzen wenn ≥200 aktive Nutzer vorhanden — leerer Leaderboard schadet mehr als er nützt.
      Erstes Community-Feature nach Go-Live; vor community-events und social-feed.
    related_features:
      - community-events
      - social-sharing

  - id: community-events
    name: "Community Events"
    status: planned
    category: community
    phase: phase-2
    description: >
      Regionale Events und Community-Challenges. Directus Collections für Events geplant.
      Beitrag zu Gesundheitsziel Österreich Nr. 5 (sozialer Zusammenhalt).
    req_ref: REQ-P-052
    related_features:
