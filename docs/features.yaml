  - id: google-oauth
    name: "Google OAuth (Login / Registrierung)"
    status: implemented
    category: auth
    phase: mvp
    description: >
      Google OAuth 2.0 als Alternative zu E-Mail + Passwort.
      Benutzerdefinierter SvelteKit-Flow (Option B) – unabhängig von Directus-SSO-Konfiguration.
      GET /api/auth/google → CSRF-State-Cookie → Redirect zu Google.
      GET /api/auth/google/callback → Code-Exchange → User finden/anlegen → Directus-JWT → localStorage.
    notes: >
      Implementiert Mai 2026. Google Cloud Projekt 'austrofit-production'.
      Redirect URIs in Google Cloud Console registriert:
        http://localhost:5173/api/auth/google/callback (lokale Entwicklung)
        https://dev.austrofit.at/api/auth/google/callback (Vercel Preview)
        https://austrofit.at/api/auth/google/callback (Vercel Production)
      Env-Vars GOOGLE_CLIENT_ID + GOOGLE_CLIENT_SECRET + DIRECTUS_ADMIN_TOKEN in .env und Vercel setzen.
      DIRECTUS_ADMIN_TOKEN = Static Token des Directus-Administrator-Users (nicht DIRECTUS_WRITE_TOKEN –
      der teilt denselben eingeschränkten Token wie PRIVATE_CMS_STATIC_TOKEN, kein Zugriff auf directus_users).
      Sicherheitshinweis: Temporäres Passwort wird nach Directus-Login sofort rotiert
      (zweifache Rotation: vor und nach Login). JWT-Refresh funktioniert normal.
    linked_files:
      - src/routes/api/auth/google/+server.ts
      - src/routes/api/auth/google/callback/+server.ts
      - src/routes/login/+page.svelte
    related_features:
      - email-password-auth
      - magic-link

