    requirements:

      - id: iec82304-2-konformitaet
        name: "IEC 82304-2 Konformität (Wellness App Quality Label)"
        status: deferred
        evidence_type: none
        notes: >
          HINWEIS: Vollständige Anforderungsanalyse erfordert Kauf des Normtexts
          (IEC / Austrian Standards International, ca. CHF 200–300). Die konkreten
          Anforderungen sind erst nach Kauf einsehbar – nachfolgende Lücken basieren
          nur auf den Begriffsdefinitionen (Abschnitt 3.2), nicht auf den
          Anforderungskapiteln.
          Bekannte Kategorien (unvollständig): App-Transparenz, Datenschutz/Sicherheit,
          Inhaltsqualität, Technische Qualität.
          Bereits identifizierte Lücken aus Abschnitt 3.2:
          (1) Session Management (3.2.7): Standard nennt explizit automatischen Logout
          nach Inaktivität als Beispiel – AustroFit hat kein Session-Timeout (JWT
          unbegrenzt in localStorage).
          (2) Validation/Verification (3.2.8/3.2.9): Standard fordert objektive Evidenz
          für Anforderungserfüllung – AustroFit hat kein Test-Suite und keinen
          dokumentierten QA-Prozess.
          Nächste Schritte (Phase 2): Standard kaufen, vollständige Gap-Analyse,
          Self-Assessment oder Third-Party-Review.

# ─────────────────────────────────────────────────────────────────
# ZUSAMMENFASSUNG: OFFENE PFLICHTEN (sofort / kurzfristig)
# ─────────────────────────────────────────────────────────────────

open_actions:
  - prioritaet: 1
    regulierung: dsgvo-avv
    aktion: "Hetzner AVV abschließen (Kundencenter → Datenschutz → AV-Vertrag)"
    frist: "sofort umsetzbar, vor Go-Live"
    aufwand: gering
    verantwortlich: Betreiber
    hinweis: >
      Kostenlos, ca. 5 Minuten. Hetzner hostet Directus + PostgreSQL mit allen
      Nutzerdaten (Gesundheitsdaten, Profile, Punkte) – wichtigster offener AVV.

  - prioritaet: 2
    regulierung: dsgvo-avv
    aktion: "Vercel auf Pro upgraden → DPA wird automatisch Teil des Agreements"
    frist: "vor Go-Live mit echten Nutzern"
    aufwand: gering
    verantwortlich: Betreiber
    hinweis: >
      Vercel DPA (vercel.com/legal/dpa) gilt nur für Pro/Enterprise-Plan
      (bestätigt Mai 2026). Vercel verarbeitet IP-Adressen als Auftragsverarbeiter.
      Hobby-Plan: kein signierbarer AVV verfügbar.

  - prioritaet: 3
    regulierung: dsgvo-art35-dpia
    aktion: "DPIA (Datenschutz-Folgenabschätzung) erstellen"
    frist: "vor Go-Live / vor erstem echten Nutzer"
    aufwand: hoch
    verantwortlich: Betreiber + Rechtsberatung

  - prioritaet: 4
    regulierung: dsgvo-art9-consent
    aktion: "Consent-Text von Anwalt auf Art.-9-Tauglichkeit prüfen lassen (RECHTSCHECK-Kommentar in registrierung/+page.svelte)"
    frist: "vor Go-Live"
    aufwand: gering
    verantwortlich: Rechtsberatung
    hinweis: >
      Technische Implementierung abgeschlossen 2026-05-24: Checkbox in Registrierung
      Step 2, Logging (gesundheitsdaten_consent_at/version) via init-onboarding,
      Widerruf via /api/consent/revoke + UI in Profil → Datenschutz. Nur Rechts-
      Freigabe des Textwortlauts offen. Bei Textänderung CONSENT_VERSION "v1" → "v2" bumpen.

  - prioritaet: 5
    regulierung: ecg-agb
    aktion: "AGB erstellen mit Punkte-Regeln, Nutzungsbedingungen, Haftungsausschluss"
    frist: "vor Go-Live"
    aufwand: hoch
    verantwortlich: Rechtsberatung
    hinweis: >
      In den AGB auch Mindestalter 14 Jahre (§ 4 Abs. 4 DSG) und
      Altershinweis in Registrierung verankern (dsg-mindestalter).

  - prioritaet: 6
    regulierung: dsgvo-art30-vvt
    aktion: "Verarbeitungsverzeichnis (VVT) nach Art. 30 DSGVO erstellen"
    frist: "vor Go-Live"
    aufwand: mittel
    verantwortlich: Betreiber
    hinweis: >
      Pflicht wegen Gesundheitsdaten (Art. 9) – Kleinunternehmen-Ausnahme greift nicht.
      Inhalt: Verantwortlicher, Zwecke, Datenkategorien, Empfänger, Drittländer,
      Löschfristen, TOM. Kann in Eigenarbeit erstellt werden (kein Anwalt zwingend).
      Template: docs/laws/dsgvo/art-30.md (zu erstellen).

