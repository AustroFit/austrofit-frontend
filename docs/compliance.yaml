  - id: gteleg
    name: "Gesundheitstelematikgesetz (GTelG 2012)"
    rechtsgrundlage: "BGBl. I Nr. 111/2012 idgF"
    kategorie: b2g
    phase: phase-3+
    applicability: false
    begruendung: >
      Aktuell nicht anwendbar. Wird relevant bei Anbindung an ELGA oder
      öffentliche Gesundheitsdaten-Infrastrukturen (Phase 3+).
    requirements:

      - id: gteleg-elga-zulassung
        name: "ELGA-Betreiber-Zulassung und Anbindung"
        status: deferred
        evidence_type: none
        notes: >
          Für ELGA-Anbindung: Zulassungsverfahren beim ELGA GmbH / BMG.
          Technische und organisatorische Anforderungen noch nicht bekannt.
          Abhängig von politischen und regulatorischen Entscheidungen.
          Kein Handlungsbedarf vor Jahr 3.

  - id: ehealth-strategie
    name: "eHealth-Strategie Österreich 2024"
    rechtsgrundlage: "Strategiepapier BMG / BMSGPK (nicht verbindlich)"
    kategorie: b2g
    phase: phase-3+
    applicability: false
    begruendung: >
      Nicht-verbindliches Strategiepapier. Relevant als Signal für B2G-Kooperationen:
      Pilotprojekt zur Bewertung digitaler Gesundheitsanwendungen (DiGA-Äquivalent AT)
      ab 2025 geplant. Chancen für AustroFit als Pilotpartner prüfen.
