# AustroFit Compliance Registry
# Maschinenlesbare Übersicht aller anwendbaren Regularien, Gesetze, Standards und Normen
# Ablage: docs/compliance.yaml
# Erstellt: 2026-05-17
# Scope: Österreich / EU

meta:
  titel: AustroFit Compliance Registry
  version: "1.0"
  erstellt: "2026-05-17"
  beschreibung: >
    Regulierungs-Übersicht für Entwicklung, Rechts- und Investoren-Checks.
    Enthält alle anwendbaren Anforderungen mit Implementierungsstatus und Nachweis-Typ.
    Nicht-anwendbare Regularien sind mit applicability: false markiert (inkl. Begründung).
  status_werte:
    compliant:    "Anforderung erfüllt und nachweisbar"
    partial:      "Teilweise erfüllt – offene Punkte in notes"
    open:         "Noch nicht umgesetzt"
    not_applies:  "Nicht anwendbar – Begründung in notes"
    deferred:     "Zurückgestellt auf spätere Phase (Phase 2 / Phase 3+)"
  evidence_type_werte:
    code:         "Nachweis liegt im Code (Datei/Funktion/Test)"
    document:     "Nachweis liegt in einem Dokument (DSE, AGB, DPIA, etc.)"
    process:      "Nachweis liegt in einem Prozess / einer Richtlinie"
    external:     "Nachweis liegt bei Drittanbieter (Zertifikat, Auftragsverarbeitungsvertrag)"
    none:         "Kein Nachweis vorhanden"

# ─────────────────────────────────────────────────────────────────
# DATENSCHUTZ
# ─────────────────────────────────────────────────────────────────

regulations:

  - id: dsgvo
    name: "DSGVO (Datenschutz-Grundverordnung)"
    rechtsgrundlage: "Verordnung (EU) 2016/679"
    kategorie: datenschutz
    phase: mvp
    applicability: true
    law_ref: docs/laws/dsgvo/
    begruendung: >
      AustroFit verarbeitet personenbezogene Daten (E-Mail, Aktivitätsdaten, Schritte,
      Workouts, Aktivitätsgruppe) und Gesundheitsdaten im Sinne von Art. 4 Nr. 15 DSGVO.
      Verarbeitung von Gesundheitsdaten unterliegt Art. 9 (besondere Kategorien).
    requirements:

      - id: dsgvo-art9-consent
        name: "Explizite Einwilligung für Gesundheitsdaten (Art. 9 Abs. 2 lit. a)"
        status: partial
        evidence_type: code
        evidence_ref:
          - src/routes/registrierung/+page.svelte
          - src/routes/api/auth/init-onboarding/+server.ts
          - src/routes/api/consent/revoke/+server.ts
          - src/routes/profil/+page.svelte
        notes: >
          Implementiert 2026-05-24: Explizites Consent-Checkbox in Registrierung Step 2
          (Art. 9 Abs. 2 lit. a DSGVO). Consent-Logging in user_profiles:
          gesundheitsdaten_consent_at + gesundheitsdaten_consent_version ("v1") via
          /api/auth/init-onboarding. Widerruf via /api/consent/revoke (setzt
          gesundheitsdaten_consent_revoked_at + health_connected=false). Widerruf-UI
          in Profil → Datenschutz (zeigt Erteilungsdatum, Widerruf-Button, Bestätigungs-Dialog).
          OFFEN (P1): Consent-Text auf Art.-9-Tauglichkeit von Anwalt prüfen lassen
          (RECHTSCHECK-Kommentar in registrierung/+page.svelte). Bei Textänderung
          CONSENT_VERSION von "v1" auf "v2" bumpen — alle v1-Einwilligungen bleiben
          identifizierbar. OFFEN: Google-OAuth-Nutzer haben keinen Step-2-Consent
          (Phase 2 — gesondertes Consent-Gate nach OAuth nötig).

      - id: dsgvo-art13-dse
        name: "Informationspflichten (Datenschutzerklärung, Art. 13/14)"
        status: compliant
        evidence_type: document
        evidence_ref:
          - src/routes/datenschutz/+page.svelte
        notes: >
          DSE vollständig (Mai 2026). Alle Verarbeiter explizit genannt mit Rechtsgrundlage:
          PostHog (Art. 6 Abs. 1 lit. a), AWIN/TradeDoubler (Art. 6 Abs. 1 lit. f),
          Vercel (Art. 6 Abs. 1 lit. b + SCC), Directus/Hetzner (Art. 6 Abs. 1 lit. b),
          Google OAuth (Art. 6 Abs. 1 lit. a + SCC).
          Gesundheitsdaten inkl. Aktivitätsgruppe mit Art. 9 Abs. 2 lit. a ausgewiesen.
          Betroffenenrechte Art. 15–21 dokumentiert. DSE-Stand: Mai 2026.

      - id: dsgvo-art17-loeschung
        name: "Recht auf Löschung (Art. 17) und Datenportabilität (Art. 20)"
        status: compliant
        evidence_type: code
        evidence_ref:
          - src/routes/api/profile/delete/+server.ts
        notes: >
          Account-Löschung mit Kaskaden-Löschung aller Nutzerdaten implementiert.
          Datenportabilität (Export) noch nicht implementiert – kein sofortiger
          Handlungsbedarf (kein expliziter Nutzerwunsch bisher), aber für Skalierung
          empfehlenswert.

      - id: dsgvo-art25-privacy-by-design
        name: "Privacy by Design / Privacy by Default (Art. 25)"
        status: partial
        evidence_type: code
        evidence_ref:
          - src/lib/utils/auth.ts
        notes: >
          Datensparsamkeit weitgehend eingehalten (keine Standortdaten, keine
          Social-Graph-Daten). JWT in localStorage (kein httpOnly Cookie) ist bewusste
          Design-Entscheidung für Capacitor-Kompatibilität – sollte in DPIA begründet
          und dokumentiert sein. anonymous_id für Quiz-Flow = datenschutzfreundliches Design.

      - id: dsgvo-art32-tom
        name: "Technische und organisatorische Maßnahmen (Art. 32)"
        status: partial
        evidence_type: document
        evidence_ref:
          - docs/tom.yaml
        notes: >
          TOM-Dokument erstellt (Mai 2026): docs/tom.yaml mit 9 Kategorien, 23 Maßnahmen.
          Umgesetzt: HTTPS/TLS, CORS, JWT-Auth, Least-Privilege-Tokens, API-Proxy,
          Input-Validierung (Allowlist), Dedup-Checks, Datenwert-Caps, Race-Condition-Schutz,
          Pseudonymisierung, Passwort-Hashing, Löschkonzept, Staged Deployment,
          Rate-Limiting (op-1 erledigt Mai 2026): IP + Per-Account-Lockout auf allen
          kritischen Endpunkten, Security-Headers CSP/X-Frame/X-Content-Type/Referrer-Policy
          (op-3 erledigt Mai 2026) in vercel.json, Dependency-Audit (18→6 low, unvermeidbar).
          Offen (in tom.yaml/offene_punkte dokumentiert):
          Backup-Konzept schriftlich (op-2), AVV-Ablage (op-4).
          Status bleibt 'partial' bis Backup-Konzept dokumentiert ist.

      - id: dsgvo-art30-vvt
        name: "Verarbeitungsverzeichnis (Art. 30)"
        status: open
        evidence_type: document
        notes: >
          PFLICHT: Die Ausnahme für Unternehmen < 250 MA gilt NICHT wenn besondere
          Kategorien (Art. 9) verarbeitet werden. AustroFit verarbeitet Gesundheitsdaten
          → Verarbeitungsverzeichnis (VVT) ist zwingend erforderlich. Noch nicht erstellt.
          Mindestinhalt (Art. 30 Abs. 1): Name/Kontakt Verantwortlicher, Zwecke,
          Kategorien betroffener Personen und Datenkategorien, Empfänger,
          Drittlandübermittlungen inkl. Garantien, Löschfristen, TOM-Beschreibung.
          Detail: docs/laws/dsgvo/art-30.md (zu erstellen)

      - id: dsgvo-art35-dpia
        name: "Datenschutz-Folgenabschätzung DPIA (Art. 35)"
        status: open
        evidence_type: document
        notes: >
          DPIA ist Pflicht bei "umfangreicher Verarbeitung besonderer Kategorien" (Art. 35
          Abs. 3 lit. b). Gesundheitsdaten + Fitness-Tracking = klarer Anwendungsfall.
          Österreichische DSB-Blacklist prüfen (§ 4 DSFA-AV).
          Inhalt DPIA: Zweck, Notwendigkeit, Risiken, Gegenmaßnahmen, Residualrisiken.
          Zu erstellen vor Go-Live oder vor erstem echten Nutzer.

      - id: dsgvo-avv
        name: "Auftragsverarbeitungsverträge (Art. 28)"
        status: partial
        evidence_type: external
        notes: >
          Stand Mai 2026 – geklärter Status je Anbieter:
          Directus (self-hosted): KEIN AVV erforderlich – Directus hat keinen Datenzugriff
          (bestätigt: directus.io/commercial-license). Erledigt.
          PostHog EU Cloud: AVV standardmäßig enthalten. Erledigt.
          AWIN/TradeDoubler: eigenständige Verantwortliche, kein AVV nötig, DSE-Hinweis vorhanden. Erledigt.
          Vercel: DPA gilt laut vercel.com/legal/dpa (Part 1, Table 1) explizit nur für
          Pro- und Enterprise-Plan-Kunden ("This Addendum applies to Customers who are on
          Enterprise and Pro plans."). Aktuell Hobby-Plan → kein AVV. Vercel verarbeitet
          IP-Adressen + Verbindungsmetadaten als Auftragsverarbeiter → AVV vor Go-Live
          zwingend erforderlich. Lösung: Upgrade auf Vercel Pro, DPA wird automatisch
          bindend durch Agreement (keine separate Unterschrift nötig).
          Hetzner: Betreibt den Server auf dem Directus + PostgreSQL laufen (alle echten
          Nutzerdaten). AVV über Hetzner-Kundencenter → Datenschutz → AV-Vertrag
          abzuschließen (kostenlos, ca. 5 Minuten).
          BLOCKEND VOR GO-LIVE: (1) Hetzner-AVV abschließen, (2) Vercel Pro-Upgrade + DPA.

  - id: dsg
    name: "DSG (Datenschutzgesetz Österreich)"
    rechtsgrundlage: "BGBl. I Nr. 165/1999 idF BGBl. I Nr. 50/2025 (Fassung 23.05.2026)"
    kategorie: datenschutz
    phase: mvp
    applicability: true
    law_ref: docs/laws/dsg/
    screening_status: "vollständig (v1.0, 2026-05-24)"
    screening_ergebnis: >
      Vollständiges Paragraph-Screening aus RIS-PDF (Fassung 23.05.2026, 38 Seiten) erstellt.
      3 direkt anwendbare Pflichten: § 4 Abs. 4 (Mindestalter 14), § 6 (Datengeheimnis),
      § 62/63 (Strafbestimmungen bedingt). DSB Wien bleibt Aufsichtsbehörde.
      Korrektur: AustroFit verarbeitet systematisch Gesundheitsdaten (Art. 9 DSGVO) →
      DSB-Pflicht nach DSGVO Art. 37 Abs. 1 lit. c bei Wachstum prüfen.
    requirements:

      - id: dsg-dsb
        name: "Datenschutzbehörde als zuständige Aufsichtsbehörde"
        status: compliant
        evidence_type: document
        notes: >
          Zuständig: DSB Wien (Österreich). DSB-Kontakt in DSE angegeben ✅.
          ACHTUNG: AustroFit verarbeitet systematisch Gesundheitsdaten (Schritte, Cardio =
          Art. 9 Abs. 1 DSGVO). Bei wachsender Nutzerbasis kann DSGVO Art. 37 Abs. 1 lit. c
          eine DSB-Bestellungspflicht auslösen. Empfehlung: Externen DSB-Dienstleister
          beauftragen (~500–1.500€/Jahr). Vorgänger-Notiz ("keine Pflicht ohne systematische
          Art.-9-Verarbeitung") war irreführend – AustroFit HAT systematische Art.-9-Verarbeitung.

      - id: dsg-mindestalter
        name: "§ 4 Abs. 4 DSG – Mindestalter 14 Jahre für Einwilligung"
        status: open
        evidence_type: code
        notes: >
          § 4 Abs. 4 DSG setzt das Mindestalter für eigenständige Einwilligung bei
          Diensten der Informationsgesellschaft auf 14 Jahre (DSGVO Art. 8 erlaubt bis 16).
          AustroFit hat aktuell keine Altersverifikation / Altersschranke in der Registrierung.
          Aktion: In AGB und Registrierungsprozess explizit "Mindestalter 14" verankern
          (Checkbox + Hinweis). Zusammen mit AGB-Erstellung (Go-Live-Blocker) umsetzen.

      - id: dsg-datengeheimnis
        name: "§ 6 DSG – Datengeheimnis (vertragliche Mitarbeiterverpflichtung)"
        status: open
        evidence_type: document
        notes: >
          § 6 Abs. 2 DSG verpflichtet AustroFit, Mitarbeiter und Freelancer mit
          Datenzugang vertraglich zur Geheimhaltung zu verpflichten und über
          Übermittlungsanordnungen sowie Folgen von Verstößen schriftlich zu belehren (Abs. 3).
          Aktuell: Einzelgründer (kein Handlungsbedarf sofort). Trigger: Vor erstem
          Mitarbeiter-/Freelancer-Einsatz mit Zugang zu personenbezogenen Daten.
          Maßnahme: Datengeheimnis-Klausel in Vertragsvorlage + Belehrungsformular erstellen.

# ─────────────────────────────────────────────────────────────────
# EPRIVACY / TRACKING
# ─────────────────────────────────────────────────────────────────

  - id: eprivacy-tkg
    name: "ePrivacy / TKG 2021 (§ 165 ff.)"
    rechtsgrundlage: "Telekommunikationsgesetz 2021 BGBl. I Nr. 190/2021"
    kategorie: tracking
    phase: mvp
    applicability: true
    law_ref: docs/laws/tkg2021/_screening.md
    screening_status: "vollständig (v1.0-pending-review, 2026-05-24)"
    screening_ergebnis: >
      Vollständiges Paragraph-Screening aus PDF (Fassung 24.05.2026) erstellt.
      AustroFit ist kein TK-Betreiber, aber Informationsgesellschaftsdienst (ECG § 3 Z 1).
      Direkt anwendbar: § 165 Abs. 3 (Cookie/localStorage Consent) und § 174 Abs. 3 (E-Mail-Werbung).
      Ergebnis: ✅ compliant. ConsentBanner und localStorage-Klassifikation korrekt.
      Keine Marketing-E-Mails implementiert. Trigger: bei Newsletter-/Push-Implementierung neu prüfen.
    requirements:

      - id: eprivacy-consent-banner
        name: "Einwilligungs-Banner für nicht-notwendige Verarbeitung"
        status: compliant
        evidence_type: code
        evidence_ref:
          - src/lib/components/dashboard/ConsentBanner.svelte
          - src/routes/+layout.svelte
        notes: >
          Implementiert: ConsentBanner.svelte – PostHog Analytics wird erst nach
          Einwilligung (localStorage 'austrofit_analytics_consent') initialisiert.
          Accept + Decline persistieren Wahl korrekt.
          Banner-Text lautet korrekt "pseudonymisierte Nutzungsstatistiken" (Mai 2026).
          AWIN/TradeDoubler: Affiliate-Tracking findet auf der Partner-Seite statt
          (nach Klick auf Affiliate-Link), nicht auf austrofit.at – kein eigener Consent
          von AustroFit erforderlich; DSE-Hinweis auf Partner-Tracking genügt.

      - id: eprivacy-localstorage
        name: "localStorage für funktionale Daten (kein Consent erforderlich)"
        status: compliant
        evidence_type: code
        notes: >
          Auth-Token (austrofit_access_token), anonymous_id, Sync-Timestamps,
          Dev-Flags: alle funktional notwendig für den Dienst → kein Consent erforderlich
          (§ 165 Abs. 3 TKG: Ausnahme für technisch notwendige Speicherung).

# ─────────────────────────────────────────────────────────────────
# MEDIZINPRODUKTERECHT
# ─────────────────────────────────────────────────────────────────

  - id: mdr
    name: "MDR – Medical Device Regulation"
    rechtsgrundlage: "Verordnung (EU) 2017/745"
    kategorie: produktrecht
    phase: mvp
    applicability: false
    law_ref: docs/laws/mdr/_screening.md
    screening_status: "vollständig (v1.0-pending-review, 2026-05-24)"
    begruendung: >
      Vollständiges Screening aus PDF (CELEX_32017R0745_DE_TXT.pdf) erstellt.
      Art. 2 Nr. 1 MDR (Definition Medizinprodukt) + Erwägungsgrund 19 (Software/Wohlbefinden) ausgewertet.
      AustroFit ist eine Wellness-/Fitness-App ohne medizinische Zweckbestimmung:
      keine Diagnose, Behandlung, Überwachung oder Prognose von Krankheiten.
      Erwägungsgrund 19 stellt explizit klar: Software für "Lebensstil und Wohlbefinden" ist kein Medizinprodukt.
      Aktivitätsgruppen (adult/senior/pregnant/chronic) sind Gamification-Personalisierung, keine medizinischen Claims.
      Einzige Voraussetzung für dauernde Nicht-Anwendbarkeit: kein medizinischer Claim in App + Marketing.
    requirements:

      - id: mdr-no-medical-claims
        name: "Keine medizinischen Zweckbehauptungen"
        status: compliant
        evidence_type: document
        evidence_ref:
          - src/routes/registrierung/+page.svelte
          - src/routes/datenschutz/+page.svelte
        notes: >
          Disclaimer implementiert (Mai 2026): Onboarding Step 2 (Gruppenauswahl) zeigt
          "AustroFit ist keine medizinische Anwendung und ersetzt keine ärztliche Beratung."
          DSE enthält eigene Section 8 "Hinweis: Keine medizinische Anwendung".
          Kritische Grenze: Sobald AustroFit behauptet, Krankheiten zu diagnostizieren,
          zu behandeln oder zu überwachen, wird die App zum Medizinprodukt (CE-Pflicht).
          Gesundheitsartikel und Aktivitätsgruppen (chronic, pregnant) laufend prüfen –
          nur WHO/FGOE-Bewegungsempfehlungen, keine diagnostischen Claims.

# ─────────────────────────────────────────────────────────────────
# E-COMMERCE / KONSUMENTENSCHUTZ
# ─────────────────────────────────────────────────────────────────

  - id: ecg
    name: "E-Commerce-Gesetz (ECG)"
    rechtsgrundlage: "BGBl. I Nr. 152/2001 (Umsetzung Richtlinie 2000/31/EG)"
    kategorie: konsumentenschutz
    phase: mvp
    applicability: true
    law_ref: docs/laws/ecg/_screening.md
    screening_status: "vollständig (v1.0-pending-review, 2026-05-24)"
    screening_ergebnis: >
      Vollständiges Paragraph-Screening aus PDF (Fassung 23.05.2026) erstellt.
      §§ 1–27 ausgewertet. AustroFit = Diensteanbieter i.S.d. ECG (§ 3 Z 1).
      Status: ⚠️ partial. P1-Blocker: § 11 AGB fehlen vollständig.
      § 5 Impressum: ✅ Kernangaben vorhanden (UID/Kammer nach Gewerbeanmeldung).
      § 6 kommerzielle Kommunikation: ✅ AWIN-Rewards als Werbung gekennzeichnet.
      § 9/10: ⚠️ partial (vorvertragliche Info + Empfangsbestätigung an AGB-Erstellung geknüpft).
      Neue open_action hinzugefügt: § 10 Abs. 2 Empfangsbestätigung (P2).
    requirements:

      - id: ecg-impressum
        name: "Impressumspflicht (§ 5 ECG)"
        status: compliant
        evidence_type: document
        evidence_ref:
          - src/routes/impressum/+page.svelte
        notes: >
          /impressum vorhanden mit allen Pflichtangaben für Privatperson (Mai 2026):
          Name (Johannes Gnong), Anschrift (Sollingergasse 8-12/5/10, 1190 Wien),
          E-Mail (kontakt@austrofit.at), DSA-Kontaktstelle, DSA-Aufsichtsbehörde
          (KommAustria / RTR-GmbH). UID-Nummer und Kammerzugehörigkeit entfallen
          mangels Gewerbeanmeldung. Nach Gewerbeanmeldung: UID ergänzen.

      - id: ecg-agb
        name: "Allgemeine Geschäftsbedingungen (§ 11 ECG)"
        status: open
        priority: p1
        evidence_type: document
        notes: >
          AGB fehlen vollständig — § 11 ECG: müssen speicher- und wiedergebbar bereitgestellt werden.
          Mindestinhalt: Leistungsbeschreibung, Punkte-Regeln (Verfall, Nicht-Übertragbarkeit,
          kein Bargeldtausch), Nutzungsbedingungen, Haftungsausschluss, Kündigung/Löschung,
          geltendes Recht (AT), Online-Streitbeilegung (§ 14 ECG).
          Punkte ausdrücklich als "nicht übertragbar, nicht gegen Bargeld einlösbar,
          kein Geldwert" definieren (relevant für ZaDiG-Abgrenzung und GSpG).
          Nach AGB-Erstellung: Registrierungsfluss um AGB-Checkbox + Hinweis auf
          Vertragstext-Speicherung (§ 9 Abs. 1 Z 2) erweitern.

      - id: ecg-empfangsbestaetigung
        name: "Empfangsbestätigung nach Registrierung (§ 10 Abs. 2 ECG)"
        status: open
        priority: p2
        evidence_type: code
        notes: >
          § 10 Abs. 2 ECG: Unverzügliche elektronische Bestätigung des Vertragsabschlusses.
          Bei PUBLIC_EMAIL_VERIFICATION=false wird aktuell keine Bestätigungs-E-Mail versandt.
          Empfehlung: Immer eine Bestätigungs-E-Mail nach Registrierung senden (auch ohne
          Klick-Aktivierung) um § 10 Abs. 2 sicher zu erfüllen.

  - id: kschg
    name: "Konsumentenschutzgesetz (KSchG)"
    rechtsgrundlage: "BGBl. Nr. 140/1979 idgF; Fassung 24.05.2026"
    kategorie: konsumentenschutz
    phase: mvp
    applicability: true
    law_ref: docs/laws/kschg/
    screening_version: "1.0-pending-review"
    screening_date: "2026-05-24"
    open_actions:
      - id: kschg-agb-§6-konformitaet
        prioritaet: P1
        aktion: >
          AGB KSchG-§ 6-konform erstellen: kein Haftungsausschluss für Körperschäden
          (§ 6 Abs. 1 Z 9), Punkteänderungs-Klausel mit sachlicher Rechtfertigung
          (§ 6 Abs. 2 Z 3), kein exklusiver AustroFit-Gerichtsstand (§ 14), kein
          pauschaler Gewährleistungsausschluss für digitale Leistungen (§ 9).
          Verantwortlich: Rechtsberatung.
      - id: kschg-vgg-screening
        prioritaet: P2
        aktion: >
          VGG (Verbrauchergewährleistungsgesetz, BGBl. I Nr. 175/2021) screenen.
          Von §§ 7d, 9, 9a KSchG referenziert. docs/laws/vgg/_screening.md anlegen.
    requirements:

      - id: kschg-transparenz-punkte
        name: "Transparenz des Punkte-Systems"
        status: open
        evidence_type: document
        notes: >
          Nutzer muss klar verstehen: Wie werden Punkte berechnet? Verfallen Punkte?
          Wie lange sind Gutscheine gültig? Was passiert mit Punkten bei Account-Löschung?
          Aktuell im UI nicht explizit kommuniziert – in AGB und/oder FAQ dokumentieren.
          Rechtsgrundlage: § 5a Abs. 1 Z 4 KSchG + § 6 Abs. 2 Z 3 (Änderungsvorbehalt).

      - id: kschg-no-dark-patterns
        name: "Keine irreführenden Gestaltungsmuster (Dark Patterns)"
        status: compliant
        evidence_type: code
        notes: >
          Consent-Flow und Marketplace zeigen keine bekannten Dark Patterns
          (kein Confirmshaming, kein verstecktes Ablehnen, keine Countdown-Täuschung).
          Laufende Prüfung empfohlen bei neuen UI-Features.
          Rechtsgrundlage: § 28a KSchG (Verbandsklage bei Informationspflichtverstößen).

      - id: kschg-5a-informationspflichten
        name: "Vorvertragliche Informationspflichten für digitale Leistungen (§ 5a)"
        status: compliant
        evidence_type: code
        notes: >
          Implementiert 2026-05-24 in src/routes/registrierung/+page.svelte (Step 1,
          vor dem Formular). Info-Box zeigt alle 4 Pflichtangaben nach § 5a KSchG:
          (1) Kostenlosigkeit (Z 3), (2) Funktionalität + Health Connect-Berechtigung
          (Z 7), (3) Kompatibilität Android 8.0+ / minSdkVersion 26 (Z 8),
          (4) Kündigungsbedingungen / Account-Löschung (Z 6). Hinweis auf VGG-Gewähr-
          leistungsrecht (Z 5) folgt bei AGB-Erstellung. Strafe bei Verstoß war:
          bis 1.450 EUR (§ 32 KSchG) + Verbandsklagerisiko (§ 28a KSchG).

      - id: kschg-agb-§6-konformitaet
        name: "AGB-Klauseln KSchG-§ 6-konform (Haftung, Gerichtsstand, Gewährleistung)"
        status: open
        evidence_type: document
        notes: >
          § 6 Abs. 1 Z 9: Kein Haftungsausschluss für Körperverletzungen durch
          Vorsatz/grobe Fahrlässigkeit — in Fitness-App kritisch. § 14 Abs. 3:
          Kein exklusiver Gerichtsstand des Unternehmers in AGB. § 9: Kein Pauschal-
          ausschluss der VGG-Gewährleistungsrechte für digitale Leistungen.
          Erfordert Rechtsberatung bei AGB-Erstellung.

      - id: kschg-7d-bereitstellungspflicht
        name: "Bereitstellungspflicht digitale Leistungen (§ 7d)"
        status: partial
        evidence_type: infrastructure
        notes: >
          § 7d KSchG: App-Bereitstellung ist implizite Hauptleistungspflicht.
          Vercel/Hetzner bietet ausreichende Uptime. AGB-Klausel zu Wartungsfenstern
          fehlt (bei AGB-Erstellung aufnehmen). VGG-Screening erforderlich.

# ─────────────────────────────────────────────────────────────────
# GLÜCKSSPIEL / GEWINNSPIELE
# ─────────────────────────────────────────────────────────────────

  - id: gspg
    name: "Glücksspielgesetz (GSpG)"
    rechtsgrundlage: "BGBl. Nr. 620/1989 idgF (BGBl. I Nr. 50/2025, Fassung 23.05.2026)"
    kategorie: gluecksspiel
    phase: mvp
    applicability: false
    law_ref: docs/laws/gspg/_screening.md
    screened_date: "2026-05-24"
    screened_version: "1.0-pending-review"
    begruendung: >
      GSpG ist nicht anwendbar. Zwei kumulative Voraussetzungen sind nicht erfüllt:
      (1) § 1 GSpG: kein Zufallselement — Schrittzählung, Cardio, Quiz und Rewards sind
      vollständig deterministisch; (2) § 2 GSpG: kein monetärer Einsatz (Einsatz i.S.d.
      § 2 Abs. 1 Z 2) — Punkte sind nicht käuflich, Teilnahme ist kostenlos.
      Beide Schwellen (§ 1 Zufallselement + § 2 Einsatz) müssen kumulativ erfüllt sein
      für eine "Ausspielung". Da beide fehlen, ist das gesamte GSpG nicht anwendbar.
    requirements:

      - id: gspg-gewinnspiele-design
        name: "Design-Guardrail: keine kaufbaren Punkte, keine zufallsbasierten Rewards"
        status: compliant
        evidence_type: code
        notes: >
          Punkte sind ausschließlich durch Aktivität verdienbar (Schritte, Cardio, Quiz).
          Keine Lootbox-, Random-Drop- oder Kaufmechanismen implementiert.
          Rewards werden deterministisch durch Nutzer ausgewählt (kein Zufalls-Outcome).
          Trigger für GSpG-Anwendbarkeit: (1) Kaufmöglichkeit für Punkte, (2) zufallsbasierte
          Reward-Vergabe (Lootboxen), (3) Bargeld-Einlösung von Punkten.
          → Sind in `docs/laws/gspg/_screening.md` Trigger-Tabelle vollständig dokumentiert.

      - id: gspg-gewinnspiele-steuer
        name: "§ 58 Abs. 3 GSpG: 5% Abgabe auf zufallsbasierte Gewinnspiele (Phase 2)"
        status: deferred
        evidence_type: document
        notes: >
          Wenn AustroFit zufallsbasierte Promo-Aktionen einführt (Verlosungen unter Nutzern,
          kein Einsatz): § 58 Abs. 3 GSpG greift — 5% Glücksspielabgabe auf Gesamtpreiswert.
          Steuerpflicht entfällt wenn Steuerbetrag < €500/Jahr (= Preiswert < €10.000).
          ACHTUNG: Nicht § 17 GSpG (= Konzessionsabgabe für Lotterien) — § 17 gilt nicht
          für AustroFit. Richtige Rechtsgrundlage ist § 58 Abs. 3.
          Zusätzlich: Bewilligung nach § 36 GSpG beim Finanzamt Österreich für Verlosungen prüfen.
          Teilnahmebedingungen vor Feature-Launch rechtlich prüfen lassen.

