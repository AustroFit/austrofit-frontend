  - id: iec-82304-2
    name: "IEC 82304-2 (Health and Wellness Apps – Quality Requirements)"
    rechtsgrundlage: "IEC 82304-2:2021 – kostenpflichtiger Standard (IEC / Austrian Standards International)"
    kategorie: produktqualitaet
    phase: phase-2
    applicability: true
    law_ref: docs/laws/iec-82304-2/
    begruendung: >
      Anwendbar: AustroFit qualifiziert als "health app" gem. Definition 3.2.3
      ("app intended to be used specifically for managing, maintaining or improving
      health of individual persons") – Schritt-Tracking, Workout-Tracking und
      Aktivitätsgruppen dienen der Gesundheitsförderung. Nicht gesetzlich
