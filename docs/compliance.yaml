      Vollständiges Artikel-Screening aus CELEX_32022R2065_DE_TXT.pdf (95 Artikel) erstellt.
      Klassifikation: Hostingdiensteanbieter (Art. 3 g iii) JA; Online-Plattform (Art. 3 i) NEIN
      (keine öffentliche UGC-Verbreitung aktuell); Kleinstunternehmen → Art. 15 + Art. 19 Ausnahme.
      Aufsichtsbehörde: KommAustria / RTR-GmbH (Koordinator für digitale Dienste, AT).
      Bußgeldrahmen: bis 6% Jahresumsatz.
      Trigger: Leaderboard/Community-Features → Online-Plattform, aber Art. 19 Ausnahme bleibt.
    begruendung: >
      AustroFit ist Hostingdiensteanbieter (speichert nutzergenerierte Gesundheitsdaten,
      Profil, Quiz-Antworten, Punkte-Ledger). Als Kleinstunternehmen (<10 MA, <2 Mio EUR)
      gelten nur Grundpflichten (Kap. II + III Abschn. 1–2). Aktuell keine Online-Plattform
      (keine öffentliche UGC-Verbreitung). Art. 15 (Transparenzbericht) und Art. 19–28
      (Online-Plattform-Pflichten) ausgenommen.
    open_actions:
      - "[P1] Art. 16: Meldeverfahren für rechtswidrige Inhalte einrichten (abuse@austrofit.at
        + Bestätigungs-Template) – vor Go-Live"
      - "[P1] Art. 14: DSA-Inhaltsmoderationsregeln in AGB integrieren (ohnehin P1-Blocker) –
        vor Go-Live"
      - "[P2] Art. 17: Template für Begründungsmitteilung bei Kontosperrung erstellen –
        vor Account-Suspension-Feature"
      - "[P2] Art. 18: Internen Straftaten-Meldeprozess dokumentieren (Polizei 133 /
        BKA-Online) – vor Community-Launch"
    requirements:

      - id: dsa-kontaktstelle-behoerden
        name: "Zentrale Kontaktstelle für Behörden (Art. 11)"
        status: compliant
        evidence_type: document
        evidence_ref:
          - src/routes/impressum/+page.svelte
        notes: >
          Kontaktstelle (kontakt@austrofit.at) und Aufsichtsbehörde (KommAustria / RTR-GmbH)
          im Impressum eingetragen (Mai 2026). Sprache: Deutsch ✅.

      - id: dsa-kontaktstelle-nutzer
        name: "Kontaktstelle für Nutzer (Art. 12)"
        status: compliant
        evidence_type: document
        evidence_ref:
          - src/routes/impressum/+page.svelte
        notes: >
          kontakt@austrofit.at im Impressum. E-Mail-Kontakt ist ausreichend; kein
          ausschließlich automatisierter Chatbot vorhanden ✅.

      - id: dsa-agb-inhaltsmoderation
        name: "AGB: Beschränkungsregeln + Inhaltsmoderation beschreiben (Art. 14)"
        status: open
        evidence_type: document
        evidence_ref: []
        notes: >
          AGB fehlen noch vollständig (bereits P1-Go-Live-Blocker).
          DSA-Anforderung: AGB müssen Inhaltsmoderationsverfahren, Account-Suspendierungsregeln
          und Rechtsbehelfe beschreiben. Bei Rechtsberatung für AGB-Erstellung einbeziehen.

      - id: dsa-meldeverfahren
        name: "Melde- und Abhilfeverfahren für rechtswidrige Inhalte (Art. 16)"
        status: open
        evidence_type: none
        evidence_ref: []
        notes: >
          Fehlend. Einfache Umsetzung: abuse@austrofit.at oder Kontaktformular mit Label
          "Rechtswidrige Inhalte melden". Link im Impressum/DSE.
          Intern: Entscheidungsprozess definieren (Verantwortlicher: Johannes,
          Frist: 24–72h), Empfangsbestätigung per E-Mail, Entscheidungsmitteilung.

      - id: dsa-begruendungspflicht
        name: "Begründungspflicht bei Nutzer-Einschränkungen (Art. 17)"
        status: partial
        evidence_type: none
        evidence_ref: []
        notes: >
          Bei manuellen Konto-Sperrungen muss Nutzer eine Begründung + Rechtsbehelfshinweis
          erhalten. Kein formaler Mechanismus vorhanden, da Account-Suspension-Feature
          noch nicht implementiert. Vor dessen Implementierung Template erstellen.
          Rate-Limit-429-Antworten fallen nicht unter Art. 17 (technische Limits, keine
          inhaltliche Moderation).

      - id: dsa-straftaten-meldung
        name: "Meldung straftatverdächtiger Inhalte (Art. 18)"
        status: partial
        evidence_type: none
        evidence_ref: []
        notes: >
          Bei Kenntnis lebensbedrohlicher Straftaten (z.B. Suizidankündigungen in
          zukünftigen Community-Features) → unverzügliche Meldung Polizei/Staatsanwaltschaft.
          Kein dokumentierter Prozess vorhanden. Vor Community-Feature-Launch definieren:
          Eskalationspfad (Polizei 133 / BKA-Internetmeldestelle meldeportal.bundeskriminalamt.at).

      - id: dsa-nutzerbeschwerden
        name: "Internes Beschwerdemanagementsystem (Art. 20)"
        status: not_applies
        evidence_type: none
        notes: >
          Gilt nur für Online-Plattformen. AustroFit ist aktuell keine Online-Plattform
          (keine öffentliche UGC-Verbreitung). Trigger: Leaderboard/Community live.
          Bei Online-Plattform-Status weiterhin ausgenommen als Kleinstunternehmen (Art. 19),
          außer Art. 24 Abs. 3 (Nutzerzahl-Meldung auf Behördenanfrage).

      - id: dsa-transparenzbericht
        name: "Jährlicher Transparenzbericht (Art. 15)"
        status: not_applies
        evidence_type: none
        notes: >
          Art. 15 Abs. 2: Ausdrücklich ausgenommen für Kleinst- und Kleinunternehmen.
          AustroFit als Kleinstunternehmen befreit. Kein Aufwand erforderlich.

