# BARRIEREFREIHEIT
# ─────────────────────────────────────────────────────────────────

  - id: bfsg
    name: "BFSG / BaFG (Barrierefreiheitsstärkungsgesetz / Barrierefreiheitsgesetz Österreich)"
    rechtsgrundlage: "Richtlinie (EU) 2019/882 (EAA); österr. BaFG BGBl. I Nr. 80/2023; in Kraft seit 28.06.2025"
    kategorie: barrierefreiheit
    phase: phase-2
    applicability: false
    law_ref: docs/laws/bfsg/
    screening_status: "vollständig (v1.1-pending-review, 2026-05-24, basiert auf PDF)"
    screening_ergebnis: >
      Vollständiges Artikel-Screening aus PDF CELEX_32019L0882_DE_TXT.pdf (ABl. L 151/2019, 42 S.) erstellt.
      Zweistufige Prüfung: (1) Sachlicher Anwendungsbereich Art. 2: Keine der 6 Dienstleistungs-
      kategorien greift. E-Commerce (Art. 2 Abs. 2 lit. f) ist nach Art. 3 Nr. 30 (Definition
      aus PDF) auf Dienste beschränkt, die auf den "Abschluss eines Verbrauchervertrags" abzielen
      — AustroFit ist kostenlos, kein Kaufvertrag auf der Plattform → eindeutig kein Grenzfall.
      (2) Kleinstunternehmen-Ausnahme Art. 4 Abs. 5 (nicht Art. 15, das ist Konformitätsvermutung):
      < 10 Beschäftigte + €0 Umsatz (pre-revenue) → Ausnahme greift vollständig.
      Ergebnis: applicability: false. Keine BFSG-Pflichten.
      Trigger: Wachstum ≥10 MA ODER >2 Mio EUR Umsatz → sofortige Pflicht.
      Kostenpflichtiges Modell (Premium-Abo etc.) → Art. 3 Nr. 30 würde greifen.
      Proaktiv: WCAG 2.1 AA für B2G (Krankenkassen, DiGA-AT) empfohlen.
    begruendung: >
      Aktuell nicht anwendbar: (1) Art. 2 Abs. 2 greift nicht — AustroFit ist kein E-Commerce-
      Dienst i.S.d. Art. 3 Nr. 30 (kein Verbrauchervertrag auf der Plattform; kostenloser Dienst).
      (2) Art. 4 Abs. 5: AustroFit ist Kleinstunternehmen (<10 Beschäftigte, ≤2 Mio EUR Umsatz/
      Bilanzsumme gem. Art. 3 Nr. 23) — vollständige Ausnahme von Dienstleistungspflichten.
      Beim Wachstum auf ≥10 MA oder >2 Mio EUR Umsatz wird die Pflicht aktiv.
    requirements:

      - id: bfsg-wcag-future
        name: "WCAG 2.1 AA – Barrierefreiheit (für Skalierung / B2G)"
        status: deferred
        evidence_type: none
        notes: >
          Für B2G-Kooperationen (Krankenkassen, öffentliche Gesundheitsprogramme) wird
          WCAG 2.1 AA voraussichtlich Voraussetzung sein – unabhängig von gesetzlicher Pflicht.
          Empfohlen: Barrierefreiheit von Anfang an als Design-Prinzip verankern
          (Kontraste, Keyboard-Navigation, Screen-Reader-Labels).
          Übergangsfrist für bestehende Produkte bis 28. Juni 2030.

