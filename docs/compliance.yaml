        evidence_type: none
        notes: >
          Österreich plant ein DiGA-ähnliches Bewertungssystem (analog zur deutschen DiGA).
          Zertifizierung als erstattungsfähige Gesundheitsanwendung wäre strategisch wertvoll
          für Krankenkassen-Integration. Stand 2026: Pilotprojekt in Vorbereitung.
          Voraussetzung: klinische Evidenz, DSGVO-Konformität, BFSG-Konformität.

